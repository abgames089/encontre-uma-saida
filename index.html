const $=id=>document.getElementById(id);

const keys={};
const movement={forward:false,back:false,left:false,right:false};

async function loadThree(){
 if(window.THREE)return window.THREE;
 const sources=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"
 ];
 for(const url of sources){
  try{
   await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=url;
    s.onload=()=>window.THREE?resolve():reject();
    s.onerror=reject;
    document.head.appendChild(s);
   });
   if(window.THREE)return window.THREE;
  }catch(e){console.warn("Falha ao carregar:",url)}
 }
 throw new Error("Não foi possível carregar o sistema 3D. Verifique sua internet.");
}

$("play").addEventListener("click",async()=>{
 if(gameStarted)return;
 $("play").disabled=true;
 $("status").textContent="CARREGANDO ENFERMARIA...";
 try{
  await loadThree();
  if(!scene)initGame();
  $("menu").classList.add("hidden");
  $("hud").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  gameStarted=true;
  if(!isMobile())renderer.domElement.requestPointerLock?.();
  $("status").textContent="JOGO INICIADO";
 }catch(error){
  $("status").textContent=error.message;
  console.error(error);
 }finally{$("play").disabled=false}
});

function isMobile(){return matchMedia("(pointer:coarse)").matches}

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function box(w,h,d,x,y,z,color,rotation=0){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 mesh.position.set(x,y,z);
 mesh.rotation.y=rotation;
 scene.add(mesh);
 return mesh;
}

function cylinder(rt,rb,h,x,y,z,color,segments=10){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(rt,rb,h,segments),mat(color)
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

function sphere(x,y,z,sx,sy,sz,color){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(1,10,8),mat(color)
 );
 mesh.position.set(x,y,z);
 mesh.scale.set(sx,sy,sz);
 scene.add(mesh);
 return mesh;
}

function initGame(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x171c1d);
 scene.fog=new THREE.FogExp2(0x171c1d,.035);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,80);
 camera.position.set(0,1.65,4.2);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({
  antialias:false,powerPreference:"low-power"
 });
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
 renderer.shadowMap.enabled=false;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xaeb9b9,0x252827,.45));

 const ceilingLight=new THREE.PointLight(0xb8b9a9,.38,13);
 ceilingLight.position.set(0,3.1,0);
 scene.add(ceilingLight);

 createRoom();

 createFurniture();

 window.addEventListener("resize",resize);

 if(!animationStarted){
  animationStarted=true;
  animate();
 }
}

  group.add(card);
  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(.15,.006,.025),mat(0x273c4a)
  );
  stripe.position.y=.016;
  group.add(stripe);
 }

 group.position.set(x,y,z);
 scene.add(group);
 items.push(group);
 return group;
}

function createItems(){
 makeItem("flashlight",-6,.82,-2.72);
 makeItem("card",3.5,1.238,-1.25);
}

/* MÃO */

function createHand(){
 const hand=new THREE.Group();
 const palm=new THREE.Mesh(
  new THREE.BoxGeometry(.17,.12,.2),mat(0x98745f)
 );
 hand.add(palm);

 for(let i=0;i<4;i++){
  const finger=new THREE.Mesh(
   new THREE.BoxGeometry(.035,.12,.045),mat(0x98745f)
  );
  finger.position.set(-.065+i*.043,-.09,-.035);
  hand.add(finger);
 }
 hand.position.set(.4,-.38,-.72);
 camera.add(hand);
 scene.add(camera);
}

/* LANTERNA */

function createFlashlight(){
 const light=new THREE.SpotLight(0xffffff,0,18,Math.PI/8,.45,1);
 light.position.set(0,0,0);
 light.target.position.set(0,0,-1);
 camera.add(light);
 camera.add(light.target);
 camera.userData.flashlight=light;
}

/* ARMÁRIO */

function isAimingAtOpenCabinet(){
 if(!cabinetOpen)return false;
 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 const target=new THREE.Vector3(-6,1.25,-2.7);
 const toCabinet=target.sub(camera.position);
 const distance=toCabinet.length();
 toCabinet.normalize();
 return distance<3.5&&direction.dot(toCabinet)>.88;
}

function updateCabinetDoor(dt){
 if(!cabinetDoorPivot)return;
 const target=cabinetOpen?-1.35:0;
 cabinetDoorPivot.rotation.y=THREE.MathUtils.lerp(
  cabinetDoorPivot.rotation.y,target,Math.min(1,dt*5)
 );
}

function toggleCabinet(){
 cabinetOpen=!cabinetOpen;
 $("message").textContent=cabinetOpen?
  "Você abriu o armário. Há alguns materiais médicos aqui.":
  "Você fechou o armário.";
 $("use").textContent=cabinetOpen?"FECHAR":"ABRIR";
}

/* DETECÇÃO */

function updateRaycast(){
 if(heldItem){
  selectedItem=null;
  currentTarget="";
  $("message").textContent="Q / SOLTAR OBJETO";
  $("use").textContent="PEGAR";
  return;
 }

 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(items.filter(i=>i.visible),true);
 selectedItem=null;

 if(hits.length){
  let obj=hits[0].object;
  while(obj.parent&&!obj.userData.pickable)obj=obj.parent;
  if(obj.userData.pickable){
   selectedItem=obj;
   currentTarget="item";
   $("message").textContent="E / PEGAR: "+obj.userData.name;
   $("use").textContent="PEGAR";
   return;
  }
 }

 if(!cabinetOpen&&cabinetTarget){
  const cabinetHits=ray.intersectObject(cabinetTarget);
  if(cabinetHits.length){
   currentTarget="cabinet";
   $("message").textContent="E / ABRIR ARMÁRIO";
   $("use").textContent="ABRIR";
   return;
  }
 }

 if(isAimingAtOpenCabinet()){
  currentTarget="cabinet";
  $("message").textContent="E / FECHAR ARMÁRIO";
  $("use").textContent="FECHAR";
  return;
 }

 currentTarget="";
 $("use").textContent="INTERAGIR";
 $("message").textContent="Explore a enfermaria.";
}

function interact(){
 if(currentTarget==="cabinet"){toggleCabinet();return}
 if(currentTarget==="item"){pickItem();return}
 pickItem();
}

/* PEGAR OBJETO */

function pickItem(){
 if(heldItem){
  $("message").textContent="Você já está segurando um objeto.";
  return;
 }
 if(!selectedItem){
  $("message").textContent="Olhe para um objeto primeiro.";
  return;
 }

 heldItem=selectedItem;
 scene.remove(heldItem);
 heldItem.position.set(.35,-.28,-.65);
 heldItem.rotation.set(0,0,0);
 camera.add(heldItem);

 $("inventory").textContent="MÃO: "+heldItem.userData.name.toUpperCase();
 selectedItem=null;
 currentTarget="";
 $("message").textContent="Objeto pego.";
}

/* SOLTAR OBJETO */

function dropItem(){
 if(!heldItem){
  $("message").textContent="Sua mão está vazia.";
  return;
 }

 const item=heldItem;
 camera.remove(item);

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);

 const position=camera.position.clone()
  .add(direction.multiplyScalar(1.15));

 position.x=THREE.MathUtils.clamp(position.x,-7,7);
 position.z=THREE.MathUtils.clamp(position.z,-5.5,5.5);

 const onDesk=position.x>1.9&&position.x<4.1&&
  position.z<-.5&&position.z>-1.5;

 const onBedside=position.x>-5.1&&position.x<-4.2&&
  position.z<-.5&&position.z>-1.3;

 const onCabinet=position.x>-6.5&&position.x<-5.5&&
  position.z<-2.3&&position.z>-3.2;

 if(onDesk||onBedside){
  position.y=1.225+item.userData.restHeight;
 }else if(onCabinet){
  position.y=.82+item.userData.restHeight;
 }else{
  position.y=.1+item.userData.restHeight;
 }

 item.position.copy(position);
 item.rotation.set(0,Math.random()*.5,0);
 scene.add(item);

 heldItem=null;
 $("inventory").textContent="MÃO: VAZIA";
 $("message").textContent="Objeto solto.";
}

/* LANTERNA */

function toggleLight(){
 if(!heldItem||heldItem.userData.type!=="flashlight"){
  $("message").textContent="Você precisa encontrar e pegar a lanterna primeiro.";
  return;
 }
 if(battery<=0){
  $("message").textContent="A bateria acabou.";
  return;
 }

 flashlightOn=!flashlightOn;
 camera.userData.flashlight.intensity=flashlightOn?3.2:0;
 $("battery").textContent="LANTERNA: "+(flashlightOn?"LIGADA":"DESLIGADA");
}

/* MOVIMENTAÇÃO */

function updateMovement(dt){
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3()
  .crossVectors(forward,new THREE.Vector3(0,1,0))
  .normalize().negate();

 const move=new THREE.Vector3();
 if(keys.KeyW||movement.forward)move.add(forward);
 if(keys.KeyS||movement.back)move.sub(forward);
 if(keys.KeyA||movement.left)move.sub(right);
 if(keys.KeyD||movement.right)move.add(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(3*dt);
  camera.position.add(move);
 }

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7.3,7.3);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-5.3,5.3);
 camera.position.y=1.65;
}

/* LOOP */

function animate(){
 requestAnimationFrame(animate);
 if(!renderer||!scene)return;

 const dt=Math.min(clock.getDelta(),.05);

 if(gameStarted){
  updateMovement(dt);
  updateRaycast();
  updateCabinetDoor(dt);

  if(flashlightOn){
   battery=Math.max(0,battery-dt*.08);
   if(battery<=0){
    flashlightOn=false;
    camera.userData.flashlight.intensity=0;
    $("battery").textContent="LANTERNA: SEM BATERIA";
   }
  }
 }
 renderer.render(scene,camera);
}

/* REDIMENSIONAR */

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* TECLADO */

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(!gameStarted)return;
 if(e.code==="KeyE")interact();
 if(e.code==="KeyQ")dropItem();
 if(e.code==="KeyF")toggleLight();
});

document.addEventListener("keyup",e=>{keys[e.code]=false});

/* MOUSE */

document.addEventListener("mousemove",e=>{
 if(!renderer||document.pointerLockElement!==renderer.domElement)return;
 if(!gameStarted)return;

 camera.rotation.y-=e.movementX*.0025;
 camera.rotation.x-=e.movementY*.0025;
 camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x,-1.4,1.4);
});

/* CELULAR */

function bindMove(id,direction){
 const button=$(id);
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  movement[direction]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  button.addEventListener(event,()=>{
   movement[direction]=false;
  });
 });
}

bindMove("forward","forward");
bindMove("back","back");
bindMove("left","left");
bindMove("right","right");

$("lookArea").addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
});

$("lookArea").addEventListener("pointermove",e=>{
 if(!lastTouch||!gameStarted)return;
 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;

 camera.rotation.y-=dx*.004;
 camera.rotation.x-=dy*.004;
 camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x,-1.4,1.4);
 lastTouch={x:e.clientX,y:e.clientY};
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
 $("lookArea").addEventListener(event,()=>{lastTouch=null});
});

/* BOTÕES */

$("use").onclick=interact;
$("drop").onclick=dropItem;
$("light").onclick=toggleLight;

</script>
</body>
</html>
