<script>
"use strict";

const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let items=[],selectedItem=null,heldItem=null;
let flashlightOn=false,battery=100,gameStarted=false;
let animationStarted=false,lastTouch=null;
let cabinetDoorPivot=null,cabinetTarget=null,cabinetOpen=false;
let currentTarget=null;
let drawers=[],drawerTargets=[];
let hand=null;

const keys={};
const movement={forward:false,back:false,left:false,right:false};

async function loadThree(){
 if(window.THREE)return window.THREE;
 const urls=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"
 ];
 for(const url of urls){
  try{
   await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=url;s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
   });
   if(window.THREE)return window.THREE;
  }catch(e){}
 }
 throw new Error("Não foi possível carregar o sistema 3D. Verifique sua internet.");
}

$("play").onclick=async()=>{
 if(gameStarted)return;
 $("play").disabled=true;
 $("status").textContent="CARREGANDO...";
 try{
  await loadThree();
  if(!scene)initGame();
  $("menu").classList.add("hidden");
  $("hud").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  gameStarted=true;
  if(!isMobile())renderer.domElement.requestPointerLock?.();
 }catch(e){
  $("status").textContent=e.message;
 }finally{$("play").disabled=false}
};

function isMobile(){return matchMedia("(pointer:coarse)").matches}
function material(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function box(w,h,d,x,y,z,color,rotation=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);m.rotation.y=rotation;scene.add(m);return m;
}
function cylinder(rt,rb,h,x,y,z,color,segments=10){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material(color));
 m.position.set(x,y,z);scene.add(m);return m;
}
function sphere(x,y,z,sx,sy,sz,color){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),material(color));
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);scene.add(m);return m;
}

function initGame(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x171c1d);
 scene.fog=new THREE.FogExp2(0x171c1d,.035);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,80);
 camera.position.set(0,1.65,4.2);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power"});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
 renderer.shadowMap.enabled=false;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xaeb9b9,0x252827,.45));

 const ceilingLight=new THREE.PointLight(0xb8b9a9,.38,13);
 ceilingLight.position.set(0,3.1,0);scene.add(ceilingLight);

 createRoom();
 createWallDamage();
 createFurniture();
 createMedicalEquipment();
 createFloorClutter();
 createItems();
 createHand();
 createFlashlight();

 window.addEventListener("resize",resize);
 if(!animationStarted){animationStarted=true;animate()}
}

/* GAVETEIRO COM TRÊS GAVETAS */

function createDrawerCabinet(){
 const x=-4.65,z=-.9;
 // Estrutura principal
 box(.82,.92,.68,x,.52,z,0x626963);
 box(.76,.84,.62,x,.52,z,0x353c38);

 // Laterais e tampo
 box(.07,.92,.68,x-.42,.52,z,0x74796f);
 box(.07,.92,.68,x+.42,.52,z,0x74796f);
 box(.88,.08,.72,x,.99,z,0x454d48);
 box(.88,.08,.72,x,.06,z,0x454d48);

 for(let i=0;i<3;i++){
  const g=new THREE.Group();
  g.userData.isDrawer=true;
  g.userData.index=i;
  g.userData.open=false;
  g.userData.targetZ=0;

  // Caixa da gaveta
  const bottom=new THREE.Mesh(new THREE.BoxGeometry(.68,.045,.48),material(0x777d73));
  bottom.position.set(0,0,0);
  g.add(bottom);

  const leftSide=new THREE.Mesh(new THREE.BoxGeometry(.045,.21,.48),material(0x686f67));
  leftSide.position.set(-.34,.105,0);g.add(leftSide);

  const rightSide=leftSide.clone();
  rightSide.position.x=.34;g.add(rightSide);

  const back=new THREE.Mesh(new THREE.BoxGeometry(.68,.21,.045),material(0x686f67));
  back.position.set(0,.105,-.22);g.add(back);

  const front=new THREE.Mesh(new THREE.BoxGeometry(.72,.23,.055),material(0x85877b));
  front.position.set(0,.115,.255);g.add(front);

  // Puxador metálico
  const handle=new THREE.Mesh(new THREE.BoxGeometry(.17,.035,.055),material(0x353c3c,.45,.7));
  handle.position.set(0,.13,.31);g.add(handle);

  // Suportes do puxador
  for(const hx of [-.065,.065]){
   const support=new THREE.Mesh(new THREE.BoxGeometry(.025,.07,.04),material(0x555d5b,.4,.6));
   support.position.set(hx,.13,.285);g.add(support);
  }

  const y=.76-i*.29;
  g.position.set(x,y,z+.34);
  scene.add(g);
  drawers.push(g);

  // Conteúdo visível dentro da gaveta quando aberta
  if(i===0){
   const paper=new THREE.Mesh(new THREE.BoxGeometry(.28,.012,.2),material(0xc2bba5));
   paper.position.set(0,.035,-.06);g.add(paper);
   const pen=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.22,6),material(0x292f37));
   pen.rotation.z=Math.PI/2;pen.position.set(.05,.05,.02);g.add(pen);
  }
  if(i===1){
   const boxItem=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.16),material(0x9b9b86));
   boxItem.position.set(-.1,.08,-.04);g.add(boxItem);
  }
  if(i===2){
   const bandage=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.08,10),material(0xd2cbb7));
   bandage.rotation.x=Math.PI/2;bandage.position.set(.08,.07,-.04);g.add(bandage);
  }

  // Área de interação invisível
  const target=new THREE.Mesh(
   new THREE.BoxGeometry(.78,.25,.16),
   new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
  );
  target.position.set(x,y,z+.69);
  target.userData.drawerIndex=i;
  scene.add(target);
  drawerTargets.push(target);
 }
}

/* ITENS PEGÁVEIS */

function makeItem(type,x,y,z){
 const group=new THREE.Group();
 group.userData.type=type;
 group.userData.name=type==="flashlight"?"Lanterna":"Cartão de acesso";
 group.userData.pickable=true;
 group.userData.restHeight=type==="flashlight"?.075:.013;

 if(type==="flashlight"){
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.48,10),material(0x20272b));
  body.rotation.x=Math.PI/2;group.add(body);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(.078,.078,.025,10),
   new THREE.MeshBasicMaterial({color:0xd7e6ec}));
  lens.rotation.x=Math.PI/2;lens.position.z=-.245;group.add(lens);
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.12,10),material(0x4b5558));
  grip.rotation.x=Math.PI/2;grip.position.z=.12;group.add(grip);
 }else{
  const card=new THREE.Mesh(new THREE.BoxGeometry(.24,.025,.16),material(0xb5c8d0));
  group.add(card);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(.15,.006,.025),material(0x273c4a));
  stripe.position.y=.016;group.add(stripe);
 }
 group.position.set(x,y,z);scene.add(group);items.push(group);return group;
}
function createItems(){
 makeItem("flashlight",-6,.82,-2.72);
 makeItem("card",3.5,1.238,-1.25);
}

function createHand(){

 const skin=material(0x98745f);
 const palm=new THREE.Mesh(new THREE.BoxGeometry(.12,.16,.09),skin);
 hand.add(palm);

 // Dedos menores e arredondados

  const finger=new THREE.Mesh(new THREE.CapsuleGeometry(.018,.075,3,5),skin);
  finger.position.set(-.045+i*.03,-.105,-.005);
  hand.add(finger);
 }
 const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(.02,.07,3,5),skin);
 thumb.position.set(.085,-.015,.005);
 thumb.rotation.z=-.7;hand.add(thumb);

 hand.position.set(.34,-.32,-.62);
 hand.rotation.set(-.15,.1,-.15);
 camera.add(hand);
 scene.add(camera);
}

/* LANTERNA */

function createFlashlight(){
 const light=new THREE.SpotLight(0xffffff,0,18,Math.PI/8,.45,1);
 light.position.set(0,0,0);
 light.target.position.set(0,0,-1);
 camera.add(light);camera.add(light.target);
 camera.userData.flashlight=light;
}

/* ARMÁRIO E GAVETAS */

function toggleCabinet(){
 cabinetOpen=!cabinetOpen;
 $("message").textContent=cabinetOpen?"Armário aberto.":"Armário fechado.";
}
function updateCabinetDoor(dt){
 if(cabinetDoorPivot){
  cabinetDoorPivot.rotation.y=THREE.MathUtils.lerp(
   cabinetDoorPivot.rotation.y,cabinetOpen?-1.35:0,Math.min(1,dt*5));
 }
}

function toggleDrawer(index){
 const drawer=drawers[index];
 if(!drawer)return;
 drawer.userData.open=!drawer.userData.open;
 drawer.userData.targetZ=drawer.userData.open?.48:0;
 $("message").textContent=drawer.userData.open?
  "Gaveta "+(index+1)+" aberta.":"Gaveta "+(index+1)+" fechada.";
}

function updateDrawers(dt){
 for(const d of drawers){
  const target=d.userData.targetZ||0;
  d.position.z=THREE.MathUtils.lerp(d.position.z,
   (-.9+.34)+target,Math.min(1,dt*7));
 }
}

/* DETECÇÃO DE INTERAÇÃO */

function updateRaycast(){
 if(heldItem){
  selectedItem=null;currentTarget=null;
  $("message").textContent="Q / SOLTAR OBJETO";
  $("use").textContent="SOLTAR";
  return;
 }

 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const itemHits=ray.intersectObjects(items,true);
 selectedItem=null;

 if(itemHits.length){
  let obj=itemHits[0].object;
  while(obj.parent&&!obj.userData.pickable)obj=obj.parent;
  if(obj.userData.pickable){
   selectedItem=obj;currentTarget={type:"item"};
   $("message").textContent="E / PEGAR: "+obj.userData.name;
   $("use").textContent="PEGAR";return;
  }
 }

 const drawerHits=ray.intersectObjects(drawerTargets,false);
 if(drawerHits.length&&drawerHits[0].distance<3.2){
  const index=drawerHits[0].object.userData.drawerIndex;
  currentTarget={type:"drawer",index};
  $("message").textContent="E / "+(drawers[index].userData.open?"FECHAR":"ABRIR")+" GAVETA "+(index+1);
  $("use").textContent=drawers[index].userData.open?"FECHAR":"ABRIR";
  return;
 }

 if(cabinetTarget&&!cabinetOpen){
  const hits=ray.intersectObject(cabinetTarget);
  if(hits.length&&hits[0].distance<3.5){
   currentTarget={type:"cabinet"};
   $("message").textContent="E / ABRIR ARMÁRIO";
   $("use").textContent="ABRIR";return;
  }
 }

 if(cabinetOpen){
  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);
  const to=new THREE.Vector3(-6,1.25,-2.7).sub(camera.position);
  const distance=to.length();to.normalize();
  if(distance<3.5&&direction.dot(to)>.88){
   currentTarget={type:"cabinet"};
   $("message").textContent="E / FECHAR ARMÁRIO";
   $("use").textContent="FECHAR";return;
  }
 }

 currentTarget=null;
 $("use").textContent="INTERAGIR";
 $("message").textContent="Explore a enfermaria.";
}

function interact(){
 if(heldItem){dropItem();return}
 if(!currentTarget){pickItem();return}
 if(currentTarget.type==="item"){pickItem();return}
 if(currentTarget.type==="drawer"){toggleDrawer(currentTarget.index);return}
 if(currentTarget.type==="cabinet"){toggleCabinet();return}
}

/* PEGAR E SOLTAR */

function pickItem(){
 if(heldItem||!selectedItem)return;
 heldItem=selectedItem;
 scene.remove(heldItem);
 heldItem.position.set(.28,-.25,-.52);
 heldItem.rotation.set(0,0,0);
 camera.add(heldItem);
 $("inventory").textContent="MÃO: "+heldItem.userData.name.toUpperCase();
 $("message").textContent="Objeto pego.";
 selectedItem=null;currentTarget=null;
}

function dropItem(){
 if(!heldItem){$("message").textContent="Sua mão está vazia.";return}
 const item=heldItem;
 camera.remove(item);

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 const position=camera.position.clone().add(direction.multiplyScalar(1.15));

 position.x=THREE.MathUtils.clamp(position.x,-7,7);
 position.z=THREE.MathUtils.clamp(position.z,-5.5,5.5);

 // Posição aproximada no piso: sem deixar o objeto atravessar o chão.
 position.y=.1+item.userData.restHeight;

 // Apoio sobre o tampo da mesa quando estiver na região da mesa.
 if(position.x>1.9&&position.x<4.1&&position.z<-.5&&position.z>-1.5){
  position.y=1.225+item.userData.restHeight;
 }
 // Apoio sobre a mesa de cabeceira.
 if(position.x>-5.1&&position.x<-4.2&&position.z<-.5&&position.z>-1.3){
  position.y=1.0+item.userData.restHeight;
 }

 item.position.copy(position);
 item.rotation.set(0,Math.random()*.5,0);
 scene.add(item);
 heldItem=null;
 $("inventory").textContent="MÃO: VAZIA";
 $("message").textContent="Objeto solto.";
}

function toggleLight(){
 if(!heldItem||heldItem.userData.type!=="flashlight"){
  $("message").textContent="Encontre e pegue a lanterna primeiro.";return;
 }
 if(battery<=0){$("message").textContent="A bateria acabou.";return}
 flashlightOn=!flashlightOn;
 camera.userData.flashlight.intensity=flashlightOn?3.2:0;
 $("battery").textContent="LANTERNA: "+(flashlightOn?"LIGADA":"DESLIGADA");
}

/* MOVIMENTO */

function updateMovement(dt){
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;forward.normalize();

 const right=new THREE.Vector3().crossVectors(
  forward,new THREE.Vector3(0,1,0)).normalize().negate();

 const move=new THREE.Vector3();
 if(keys.KeyW||movement.forward)move.add(forward);
 if(keys.KeyS||movement.back)move.sub(forward);
 if(keys.KeyA||movement.left)move.sub(right);
 if(keys.KeyD||movement.right)move.add(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(3*dt);
  camera.position.add(move);
 }
 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7.3,7.3);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-5.3,5.3);
 camera.position.y=1.65;
}

function animate(){
 requestAnimationFrame(animate);
 if(!renderer||!scene)return;
 const dt=Math.min(clock.getDelta(),.05);

 if(gameStarted){
  updateMovement(dt);
  updateRaycast();
  updateCabinetDoor(dt);
  updateDrawers(dt);

  if(flashlightOn){
   battery=Math.max(0,battery-dt*.08);
   if(battery<=0){
    flashlightOn=false;
    camera.userData.flashlight.intensity=0;
    $("battery").textContent="LANTERNA: SEM BATERIA";
   }
  }
 }
 renderer.render(scene,camera);
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* TECLADO */

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(!gameStarted)return;
 if(e.code==="KeyE")interact();
 if(e.code==="KeyQ")dropItem();
 if(e.code==="KeyF")toggleLight();
});
document.addEventListener("keyup",e=>{keys[e.code]=false});

document.addEventListener("mousemove",e=>{
 if(!renderer||document.pointerLockElement!==renderer.domElement||!gameStarted)return;
 camera.rotation.y-=e.movementX*.0025;
 camera.rotation.x-=e.movementY*.0025;
 camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x,-1.4,1.4);
});

/* CELULAR */

function bindMove(id,direction){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();movement[direction]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  b.addEventListener(ev,()=>movement[direction]=false);
 });
}
bindMove("forward","forward");
bindMove("back","back");
bindMove("left","left");
bindMove("right","right");

$("lookArea").addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
});
$("lookArea").addEventListener("pointermove",e=>{
 if(!lastTouch||!gameStarted)return;
 const dx=e.clientX-lastTouch.x,dy=e.clientY-lastTouch.y;
 camera.rotation.y-=dx*.004;
 camera.rotation.x-=dy*.004;
 camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x,-1.4,1.4);
 lastTouch={x:e.clientX,y:e.clientY};
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
 $("lookArea").addEventListener(ev,()=>lastTouch=null);
});

$("use").onclick=interact;
$("drop").onclick=dropItem;
$("light").onclick=toggleLight;
</script>
</body>
</html>
