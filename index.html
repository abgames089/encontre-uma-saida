"use strict";

const $=id=>document.getElementById(id);

let flashlightOn=false,battery=100,gameStarted=false;

$("play").onclick=async()=>{
 if(gameStarted)return;

 $("play").disabled=true;
 $("status").textContent="CARREGANDO...";

 try{
  await loadThree();
  if(!scene)initGame();

  $("menu").classList.add("hidden");
  $("hud").classList.remove("hidden");
  $("controls").classList.remove("hidden");

  gameStarted=true;

  if(!isMobile()){
   renderer.domElement.requestPointerLock?.();
  }
 }catch(e){
  $("status").textContent="ERRO: "+e.message;
 }finally{
  $("play").disabled=false;
 }
};

async function loadThree(){
 if(window.THREE)return window.THREE;

 const urls=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"
 ];

 for(const url of urls){
  try{
   await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=url;
    s.onload=resolve;
    s.onerror=reject;
    document.head.appendChild(s);
   });

   if(window.THREE)return window.THREE;
  }catch(e){}
 }

 throw new Error("Verifique sua conexão com a internet.");
}

function isMobile(){
 return matchMedia("(pointer:coarse)").matches;
}

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,
  roughness,
  metalness
 });
}

function box(w,h,d,x,y,z,color,rotation=0){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color)
 );
 m.position.set(x,y,z);
 m.rotation.y=rotation;
 scene.add(m);
 return m;
}

function cylinder(rt,rb,h,x,y,z,color,segments=10){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(rt,rb,h,segments),
  mat(color,.85,.25)
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

function sphere(x,y,z,sx,sy,sz,color){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(1,10,8),
  mat(color)
 );
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 scene.add(m);
 return m;
}

/* TEXTURAS PROCEDURAIS — V1.5 */
function makeCanvasTexture(kind){
 const canvas=document.createElement("canvas");
 canvas.width=canvas.height=512;
 const ctx=canvas.getContext("2d");

 if(kind==="floor"){
  ctx.fillStyle="#777a73";
  ctx.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=128){
   for(let x=0;x<512;x+=128){
    const shade=105+Math.floor(Math.random()*28);
    ctx.fillStyle=`rgb(${shade},${shade+2},${shade-4})`;
    ctx.fillRect(x+2,y+2,124,124);
    ctx.strokeStyle="rgba(25,30,27,.55)";
    ctx.lineWidth=3;
    ctx.strokeRect(x+2,y+2,124,124);
   }
  }
  for(let i=0;i<1800;i++){
   const v=Math.floor(Math.random()*65);
   ctx.fillStyle=`rgba(${v},${v+5},${v},${Math.random()*.18})`;
   ctx.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*5,1+Math.random()*4);
  }
 }else if(kind==="wall"){
  ctx.fillStyle="#969990";
  ctx.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){
   const dark=Math.random()>.5;
   ctx.fillStyle=dark?"rgba(45,53,47,.07)":"rgba(235,235,220,.08)";
   ctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*18,2+Math.random()*12);
  }
  for(let i=0;i<24;i++){
   const x=Math.random()*512,y=Math.random()*512;
   const g=ctx.createRadialGradient(x,y,2,x,y,20+Math.random()*55);
   g.addColorStop(0,"rgba(45,53,46,.22)");
   g.addColorStop(1,"rgba(45,53,46,0)");
   ctx.fillStyle=g;ctx.fillRect(x-70,y-70,140,140);
  }
 }else{
  ctx.fillStyle="#626861";
  ctx.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=128){
   for(let x=0;x<512;x+=128){
    ctx.strokeStyle="rgba(25,30,27,.45)";
    ctx.lineWidth=4;
    ctx.strokeRect(x+2,y+2,124,124);
   }
  }
  for(let i=0;i<1200;i++){
   ctx.fillStyle="rgba(220,225,215,.05)";
   ctx.fillRect(Math.random()*512,Math.random()*512,2,2);
  }
 }

 const texture=new THREE.CanvasTexture(canvas);
 texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
 texture.colorSpace=THREE.SRGBColorSpace;
 texture.anisotropy=2;
 return texture;
}

function texturedBox(w,h,d,x,y,z,texture,repeatX=1,repeatY=1){
 const tex=texture.clone();
 tex.needsUpdate=true;
 tex.repeat.set(repeatX,repeatY);
 const material=new THREE.MeshStandardMaterial({
  map:tex,roughness:.96,metalness:0
 });
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

/* GAVETAS */

function createDrawerCabinet(){
 const x=-4.65,z=-.9;

 box(.82,.92,.68,x,.52,z,0x777e76);
 box(.76,.84,.62,x,.52,z,0x454c47);
 box(.07,.92,.68,x-.42,.52,z,0x858b80);
 box(.07,.92,.68,x+.42,.52,z,0x858b80);
 box(.88,.08,.72,x,.99,z,0x555d57);
 box(.88,.08,.72,x,.06,z,0x555d57);

 for(let i=0;i<3;i++){
  const g=new THREE.Group();

  g.userData.isDrawer=true;
  g.userData.index=i;
  g.userData.open=false;
  g.userData.targetZ=0;

  const bottom=new THREE.Mesh(
   new THREE.BoxGeometry(.68,.045,.48),
   mat(0x858b80)
  );
  g.add(bottom);

  const leftSide=new THREE.Mesh(
   new THREE.BoxGeometry(.045,.21,.48),
   mat(0x777e76)
  );
  leftSide.position.set(-.34,.105,0);
  g.add(leftSide);

  const rightSide=leftSide.clone();
  rightSide.position.x=.34;
  g.add(rightSide);

  const back=new THREE.Mesh(
   new THREE.BoxGeometry(.68,.21,.045),
   mat(0x777e76)
  );
  back.position.set(0,.105,-.22);
  g.add(back);

  const front=new THREE.Mesh(
   new THREE.BoxGeometry(.72,.23,.055),
   mat(0x999b90)
  );
  front.position.set(0,.115,.255);
  g.add(front);

  const handle=new THREE.Mesh(
   new THREE.BoxGeometry(.17,.035,.055),
   mat(0x555d5b,.45,.7)
  );
  handle.position.set(0,.13,.31);
  g.add(handle);

  const y=.76-i*.29;

  g.position.set(x,y,z+.34);
  scene.add(g);
  drawers.push(g);

  if(i===0){
   const paper=new THREE.Mesh(
    new THREE.BoxGeometry(.28,.012,.2),
    mat(0xc2bba5)
   );
   paper.position.set(0,.035,-.06);
   g.add(paper);

   const pen=new THREE.Mesh(
    new THREE.CylinderGeometry(.012,.012,.22,6),
    mat(0x292f37)
   );
   pen.rotation.z=Math.PI/2;
   pen.position.set(.05,.05,.02);
   g.add(pen);
  }

  if(i===1){
   const obj=new THREE.Mesh(
    new THREE.BoxGeometry(.22,.12,.16),
    mat(0x9b9b86)
   );
   obj.position.set(-.1,.08,-.04);
   g.add(obj);
  }

  if(i===2){
   const bandage=new THREE.Mesh(
    new THREE.CylinderGeometry(.07,.07,.08,10),
    mat(0xd2cbb7)
   );
   bandage.rotation.x=Math.PI/2;
   bandage.position.set(.08,.07,-.04);
   g.add(bandage);
  }

  const target=new THREE.Mesh(
   new THREE.BoxGeometry(.78,.25,.16),
   new THREE.MeshBasicMaterial({
    transparent:true,
    opacity:0,
    depthWrite:false
   })
  );

  target.position.set(x,y,z+.69);
  target.userData.drawerIndex=i;
  scene.add(target);
  drawerTargets.push(target);
 }
}

/* OBJETOS PEGÁVEIS */

function makeItem(type,x,y,z){
 const group=new THREE.Group();

 group.userData.type=type;
 group.userData.name=type==="flashlight"?"Lanterna":"Cartão de acesso";
 group.userData.pickable=true;
 group.userData.restHeight=type==="flashlight"?.075:.013;
 group.userData.physics=false;
 group.userData.velocity=new THREE.Vector3(0,0,0);

 if(type==="flashlight"){
  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.075,.48,10),
   mat(0x30383c)
  );
  body.rotation.x=Math.PI/2;
  group.add(body);

  const lens=new THREE.Mesh(
   new THREE.CylinderGeometry(.078,.078,.025,10),
   new THREE.MeshBasicMaterial({color:0xd7e6ec})
  );
  lens.rotation.x=Math.PI/2;
  lens.position.z=-.245;
  group.add(lens);

  const grip=new THREE.Mesh(
   new THREE.CylinderGeometry(.08,.08,.12,10),
   mat(0x4b5558)
  );
  grip.rotation.x=Math.PI/2;
  grip.position.z=.12;
  group.add(grip);
 }else{
  const card=new THREE.Mesh(
   new THREE.BoxGeometry(.24,.025,.16),
   mat(0xb5c8d0)
  );
  group.add(card);

  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(.15,.006,.025),
   mat(0x273c4a)
  );
  stripe.position.y=.016;
  group.add(stripe);
 }

 group.position.set(x,y,z);
 scene.add(group);
 items.push(group);

 return group;
}

function createItems(){
 makeItem("flashlight",-6,.82,-2.72);
 makeItem("card",3.5,1.238,-1.25);
}

function createHand(){
 hand=new THREE.Group();
 const skin=mat(0x98745f);
 hand.userData.fingers=[];

 const palm=new THREE.Mesh(
  new THREE.BoxGeometry(.12,.16,.09),
  skin
 );
 hand.add(palm);

 for(let i=0;i<4;i++){
  const finger=new THREE.Mesh(
   new THREE.CapsuleGeometry(.018,.075,3,5),
   skin
  );
  finger.position.set(-.045+i*.03,-.105,-.005);
  hand.add(finger);
  hand.userData.fingers.push(finger);
 }

 const thumb=new THREE.Mesh(
  new THREE.CapsuleGeometry(.02,.07,3,5),
  skin
 );
 thumb.position.set(.085,-.015,.005);
 thumb.rotation.z=-.7;
 hand.add(thumb);
 hand.userData.thumb=thumb;

 hand.position.set(.34,-.32,-.62);
 hand.rotation.set(-.15,.1,-.15);
 camera.add(hand);
 scene.add(camera);
}

function setHandGrip(gripping){
 if(!hand)return;
 hand.userData.fingers.forEach((finger,i)=>{
  finger.rotation.x=gripping?-.55:0;
  finger.rotation.z=gripping?(i-1.5)*.035:0;
 });
 if(hand.userData.thumb){
  hand.userData.thumb.rotation.z=gripping?-.95:-.7;
 }
 hand.rotation.z=gripping?-.23:-.15;
}

/* INTERAÇÕES */

function toggleCabinet(){
 cabinetOpen=!cabinetOpen;

 $("message").textContent=cabinetOpen?
  "Armário aberto.":
  "Armário fechado.";
}

function updateCabinetDoor(dt){
 if(cabinetDoorPivot){
  cabinetDoorPivot.rotation.y=THREE.MathUtils.lerp(
   cabinetDoorPivot.rotation.y,
   cabinetOpen?-1.35:0,
   Math.min(1,dt*5)
  );
 }
}

function toggleDrawer(index){
 const drawer=drawers[index];
 if(!drawer)return;

 drawer.userData.open=!drawer.userData.open;
 drawer.userData.targetZ=drawer.userData.open?.48:0;

 $("message").textContent=drawer.userData.open?
  "Gaveta "+(index+1)+" aberta.":
  "Gaveta "+(index+1)+" fechada.";
}

function updateDrawers(dt){
 for(const d of drawers){
  const target=d.userData.targetZ||0;

  d.position.z=THREE.MathUtils.lerp(
   d.position.z,
   (-.9+.34)+target,
   Math.min(1,dt*7)
  );
 }
}

/* DETECÇÃO DE OBJETOS */

function updateRaycast(){
 if(heldItem){
  selectedItem=null;
  currentTarget=null;

  $("message").textContent="Q / SOLTAR OBJETO";
  $("use").textContent="SOLTAR";
  return;
 }

 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);

 const itemHits=ray.intersectObjects(items,true);
 selectedItem=null;

 if(itemHits.length&&itemHits[0].distance<3.2){
  let obj=itemHits[0].object;

  while(obj.parent&&!obj.userData.pickable){
   obj=obj.parent;
  }

  if(obj.userData.pickable){
   selectedItem=obj;
   currentTarget={type:"item"};

   $("message").textContent="E / PEGAR: "+obj.userData.name;
   $("use").textContent="PEGAR";
   return;
  }
 }

 const drawerHits=ray.intersectObjects(drawerTargets,false);

 if(drawerHits.length&&drawerHits[0].distance<3.2){
  const index=drawerHits[0].object.userData.drawerIndex;

  currentTarget={type:"drawer",index};

  $("message").textContent="E / "+
   (drawers[index].userData.open?"FECHAR":"ABRIR")+
   " GAVETA "+(index+1);

  $("use").textContent=drawers[index].userData.open?"FECHAR":"ABRIR";
  return;
 }

 if(cabinetTarget){
  const hits=ray.intersectObject(cabinetTarget);

  if(hits.length&&hits[0].distance<3.5){
   currentTarget={type:"cabinet"};

   $("message").textContent="E / "+
    (cabinetOpen?"FECHAR":"ABRIR")+" ARMÁRIO";

   $("use").textContent=cabinetOpen?"FECHAR":"ABRIR";
   return;
  }
 }

 currentTarget=null;
 $("use").textContent="INTERAGIR";
 $("message").textContent="Explore a enfermaria.";
}

function interact(){
 if(heldItem){
  dropItem();
  return;
 }

 if(!currentTarget){
  pickItem();
  return;
 }

 if(currentTarget.type==="item"){
  pickItem();
  return;
 }

 if(currentTarget.type==="drawer"){
  toggleDrawer(currentTarget.index);
  return;
 }

 if(currentTarget.type==="cabinet"){
  toggleCabinet();
  return;
 }
}

/* PEGAR E SOLTAR */

function pickItem(){
 if(heldItem||!selectedItem)return;

 heldItem=selectedItem;
 scene.remove(heldItem);
 camera.add(heldItem);

 heldItem.userData.physics=false;
 heldItem.userData.velocity.set(0,0,0);
 heldItem.userData.pickupProgress=0;
 heldItem.userData.holdTarget=heldItem.userData.type==="flashlight"?
  new THREE.Vector3(.27,-.22,-.58):
  new THREE.Vector3(.27,-.25,-.52);
 heldItem.userData.holdRotation=heldItem.userData.type==="flashlight"?
  new THREE.Euler(0,0,0):
  new THREE.Euler(-.18,0,0);
 heldItem.position.set(.12,-.12,-.38);
 heldItem.rotation.set(.2,0,.18);
 heldItem.scale.setScalar(.92);

 setHandGrip(true);
 $("inventory").textContent="MÃO: "+heldItem.userData.name.toUpperCase();
 $("message").textContent="Você pegou: "+heldItem.userData.name+".";

 selectedItem=null;
 currentTarget=null;
}

function dropItem(){
 if(!heldItem){
  $("message").textContent="Sua mão está vazia.";
  return;
 }

 const item=heldItem;
 if(item.userData.type==="flashlight"&&flashlightOn){
  flashlightOn=false;
  camera.userData.flashlight.intensity=0;
  $("battery").textContent="LANTERNA: DESLIGADA";
 }

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 const position=camera.position.clone().add(direction.multiplyScalar(.85));
 const floorY=.1+item.userData.restHeight;
 position.x=THREE.MathUtils.clamp(position.x,-7.55,7.55);
 position.z=THREE.MathUtils.clamp(position.z,-5.55,5.55);
 position.y=Math.max(floorY,camera.position.y-.55+direction.y*.25);

 camera.remove(item);
 scene.add(item);
 item.position.copy(position);
 item.rotation.set(
  0,
  camera.rotation.y,
  item.userData.type==="flashlight"?0:(Math.random()-.5)*.35
 );
 item.scale.setScalar(1);
 item.userData.physics=true;
 item.userData.velocity.set(direction.x*1.05,.65+Math.max(0,direction.y*.3),direction.z*1.05);
 item.userData.floorY=floorY;
 item.userData.pickupProgress=1;

 heldItem=null;
 setHandGrip(false);
 $("inventory").textContent="MÃO: VAZIA";
 $("message").textContent="Objeto solto.";
}

function updateHeldItem(dt){
 if(!heldItem)return;
 const target=heldItem.userData.holdTarget;
 const rot=heldItem.userData.holdRotation;
 if(!target||!rot)return;
 const smooth=Math.min(1,dt*11);
 heldItem.position.lerp(target,smooth);
 heldItem.rotation.x=THREE.MathUtils.lerp(heldItem.rotation.x,rot.x,smooth);
 heldItem.rotation.y=THREE.MathUtils.lerp(heldItem.rotation.y,rot.y,smooth);
 heldItem.rotation.z=THREE.MathUtils.lerp(heldItem.rotation.z,rot.z,smooth);
 heldItem.scale.lerp(new THREE.Vector3(1,1,1),smooth);
}

function updateDroppedItems(dt){
 for(const item of items){
  if(!item.userData.physics)continue;
  const velocity=item.userData.velocity;
  velocity.y-=9.8*dt;
  item.position.addScaledVector(velocity,dt);

  const floorY=item.userData.floorY||(.1+item.userData.restHeight);
  if(item.position.y<=floorY){
   item.position.y=floorY;
   if(Math.abs(velocity.y)>.35){
    velocity.y*=-.18;
   }else{
    velocity.y=0;
   }
   velocity.x*=Math.pow(.08,dt);
   velocity.z*=Math.pow(.08,dt);
   if(Math.abs(velocity.x)<.025)velocity.x=0;
   if(Math.abs(velocity.z)<.025)velocity.z=0;
  }
  item.position.x=THREE.MathUtils.clamp(item.position.x,-7.55,7.55);
  item.position.z=THREE.MathUtils.clamp(item.position.z,-5.55,5.55);
  if(velocity.lengthSq()<.002)item.userData.physics=false;
 }
}

function toggleLight(){
 if(!heldItem||heldItem.userData.type!=="flashlight"){
  $("message").textContent="Encontre e pegue a lanterna primeiro.";
  return;
 }

 if(battery<=0){
  $("message").textContent="A bateria acabou.";
  return;
 }

 flashlightOn=!flashlightOn;

 camera.userData.flashlight.intensity=flashlightOn?3.2:0;

 $("battery").textContent=
  "LANTERNA: "+(flashlightOn?"LIGADA":"DESLIGADA");
}

/* MOVIMENTO */

function updateMovement(dt){
 const forward=new THREE.Vector3();

 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3().crossVectors(
  forward,
  new THREE.Vector3(0,1,0)
 ).normalize().negate();

 const move=new THREE.Vector3();

 if(keys.KeyW||movement.forward)move.add(forward);
 if(keys.KeyS||movement.back)move.sub(forward);
 if(keys.KeyA||movement.left)move.sub(right);
 if(keys.KeyD||movement.right)move.add(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(3*dt);
  camera.position.add(move);
 }

 camera.position.x=THREE.MathUtils.clamp(
  camera.position.x,-7.3,7.3
 );

 camera.position.z=THREE.MathUtils.clamp(
  camera.position.z,-5.3,5.3
 );

 camera.position.y=1.65;
}

/* LOOP */

function animate(){
 requestAnimationFrame(animate);

 if(!renderer||!scene)return;

 const dt=Math.min(clock.getDelta(),.05);

 if(gameStarted){
  updateMovement(dt);
  updateRaycast();
  updateHeldItem(dt);
  updateDroppedItems(dt);
  updateCabinetDoor(dt);
  updateDrawers(dt);

  if(flashlightOn){
   battery=Math.max(0,battery-dt*.08);

   if(battery<=0){
    flashlightOn=false;
    camera.userData.flashlight.intensity=0;
    $("battery").textContent="LANTERNA: SEM BATERIA";
   }
  }
 }

 renderer.render(scene,camera);
}

function resize(){
 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* TECLADO */

document.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(!gameStarted)return;

 if(e.code==="KeyE")interact();
 if(e.code==="KeyQ")dropItem();
 if(e.code==="KeyF")toggleLight();
});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});

document.addEventListener("mousemove",e=>{
 if(
  !renderer||
  document.pointerLockElement!==renderer.domElement||
  !gameStarted
 )return;

 camera.rotation.y-=e.movementX*.0025;
 camera.rotation.x-=e.movementY*.0025;

 camera.rotation.x=THREE.MathUtils.clamp(
  camera.rotation.x,-1.4,1.4
 );
});

/* CONTROLES MOBILE */

function bindMove(id,direction){
 const b=$(id);

 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  movement[direction]=true;
 });

 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  b.addEventListener(ev,()=>{
   movement[direction]=false;
  });
 });
}

bindMove("forward","forward");
bindMove("back","back");
bindMove("left","left");
bindMove("right","right");

$("lookArea").addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
 $("lookArea").setPointerCapture?.(e.pointerId);
});

$("lookArea").addEventListener("pointermove",e=>{
 if(!lastTouch||!gameStarted)return;

 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;

 camera.rotation.y-=dx*.004;
 camera.rotation.x-=dy*.004;

 camera.rotation.x=THREE.MathUtils.clamp(
  camera.rotation.x,-1.4,1.4
 );

 lastTouch={x:e.clientX,y:e.clientY};
});

["pointerup","pointercancel","pointerleave"].forEach(ev=>{
 $("lookArea").addEventListener(ev,()=>{
  lastTouch=null;
 });
});

$("use").onclick=interact;
$("drop").onclick=dropItem;
$("light").onclick=toggleLight;

document.addEventListener("contextmenu",e=>e.preventDefault());

</script>
