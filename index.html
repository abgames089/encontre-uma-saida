
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENCONTRE UMA SAÍDA! | AB GAMES</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/149/three.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

body {
  overflow: hidden;
  background: #050505;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center, #202020 0%, #080808 65%, #000 100%);
}

#menu h1 {
  font-size: clamp(35px, 7vw, 75px);
  letter-spacing: 5px;
  text-align: center;
  text-shadow: 0 0 20px #a00000;
}

#menu h2 {
  color: #d00000;
  letter-spacing: 7px;
  margin-top: 10px;
  font-size: 18px;
}

.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 13px;
  margin-top: 45px;
  width: 230px;
}

.menu-buttons button {
  padding: 15px;
  color: white;
  background: #171717;
  border: 1px solid #9b0000;
  cursor: pointer;
  font-size: 15px;
  letter-spacing: 2px;
  transition: .2s;
}

.menu-buttons button:hover {
  background: #850000;
  box-shadow: 0 0 20px #a00000;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: none;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  font-size: 25px;
  color: white;
  opacity: .8;
}

#message {
  position: absolute;
  bottom: 13%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  padding: 12px 20px;
  border: 1px solid #555;
  font-size: 14px;
  text-align: center;
  opacity: 0;
  transition: opacity .2s;
}

#inventory {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(0,0,0,.65);
  border: 1px solid #555;
  padding: 12px;
  min-width: 150px;
}

#inventory h3 {
  font-size: 12px;
  color: #bbb;
  margin-bottom: 8px;
}

#itemName {
  font-size: 13px;
}

#battery {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 13px;
  background: rgba(0,0,0,.7);
  padding: 10px;
}

#mobileControls {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#movement {
  position: absolute;
  left: 20px;
  bottom: 25px;
  display: grid;
  grid-template-columns: repeat(3, 48px);
  gap: 5px;
  pointer-events: auto;
}

#actions {
  position: absolute;
  right: 20px;
  bottom: 30px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
}

.touchButton {
  width: 48px;
  height: 48px;
  background: rgba(20,20,20,.8);
  color: white;
  border: 1px solid #888;
  border-radius: 8px;
  font-size: 17px;
}

.actionButton {
  width: 65px;
  height: 50px;
  background: rgba(100,0,0,.8);
  color: white;
  border: 1px solid #c33;
  border-radius: 8px;
  font-size: 11px;
}

#inspectPanel {
  position: absolute;
  display: none;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 280px;
  padding: 20px;
  background: rgba(0,0,0,.95);
  border: 1px solid #8b0000;
  text-align: center;
  pointer-events: auto;
}

#inspectPanel button {
  margin-top: 15px;
  padding: 10px 20px;
  background: #790000;
  color: white;
  border: none;
}

@media(max-width: 800px) {
  #mobileControls {
    display: block;
  }

  #inventory {
    top: 10px;
    left: 10px;
    padding: 8px;
  }

  #battery {
    top: 10px;
    right: 10px;
  }
}
</style>
</head>

<body>

<div id="menu">
  <h1>ENCONTRE UMA SAÍDA!</h1>
  <h2>AB GAMES</h2>

  <div class="menu-buttons">
    <button id="playButton">JOGAR</button>
    <button id="settingsButton">CONFIGURAÇÕES</button>
    <button id="creditsButton">CRÉDITOS</button>
  </div>

  <p style="margin-top:35px;color:#777;font-size:11px">
    DESAFIE SEUS LIMITES
  </p>
</div>

<div id="hud">
  <div id="crosshair">+</div>

  <div id="inventory">
    <h3>INVENTÁRIO</h3>
    <div id="itemName">Vazio</div>
  </div>

  <div id="battery">LANTERNA: 100%</div>
  <div id="message"></div>

  <div id="inspectPanel">
    <h3 id="inspectTitle">OBJETO</h3>
    <p id="inspectText"></p>
    <button id="closeInspect">FECHAR</button>
  </div>

  <div id="mobileControls">
    <div id="movement">
      <div></div>
      <button class="touchButton" data-move="forward">▲</button>
      <div></div>

      <button class="touchButton" data-move="left">◀</button>
      <button class="touchButton" data-move="back">▼</button>
      <button class="touchButton" data-move="right">▶</button>
    </div>

    <div id="actions">
      <button class="actionButton" id="mobileInteract">INTERAGIR</button>
      <button class="actionButton" id="mobileFlash">LANTERNA</button>
      <button class="actionButton" id="mobileDrop">SOLTAR</button>
    </div>
  </div>
</div>

<script>
/* =====================================
   ENCONTRE UMA SAÍDA!
   AB GAMES — V4.1
===================================== */

let scene, camera, renderer, clock;
let raycaster, centerNdc;

let playerVelocity = new THREE.Vector3();
let moveDirection = new THREE.Vector3();

let keys = {};
let isPlaying = false;
let isLocked = false;

let yaw = 0;
let pitch = 0;

let objects = [];
let items = [];
let selectedItem = null;
let heldItem = null;

let flashlight;
let flashlightOn = true;
let battery = 100;

let exitDoor;
let exitDoorOpen = false;
let exitDoorAngle = 0;
let exitDoorTarget = 0;

let roomTwoCreated = false;
let currentRoom = 1;

let drawers = [];
let currentTarget = null;

let messageTimeout;
let touchMovement = {
  forward: false,
  back: false,
  left: false,
  right: false
};

const PLAYER_HEIGHT = 1.7;
const PLAYER_SPEED = 3.2;

const messageElement = document.getElementById("message");
const itemNameElement = document.getElementById("itemName");

/* =====================================
   MENSAGENS
===================================== */

function showMessage(text, duration = 2500) {
  messageElement.textContent = text;
  messageElement.style.opacity = 1;

  clearTimeout(messageTimeout);

  messageTimeout = setTimeout(() => {
    messageElement.style.opacity = 0;
  }, duration);
}

/* =====================================
   MATERIAIS E OBJETOS
===================================== */

function mat(color, roughness = 0.85, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

function box(width, height, depth, material, x, y, z) {
  const geometry = new THREE.BoxGeometry(
    width, height, depth
  );

  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);
  objects.push(mesh);

  return mesh;
}

function cylinder(radiusTop, radiusBottom, height, material, x, y, z) {
  const geometry = new THREE.CylinderGeometry(
    radiusTop,
    radiusBottom,
    height,
    16
  );

  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);
  objects.push(mesh);

  return mesh;
}

/* =====================================
   INICIALIZAÇÃO
===================================== */

function initGame() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080909);
  scene.fog = new THREE.FogExp2(0x080909, 0.045);

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.set(0, PLAYER_HEIGHT, 3);

  renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance"
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  raycaster = new THREE.Raycaster();
  centerNdc = new THREE.Vector2(0, 0);

  createLighting();
  createRoom();
  createFurniture();
  createComputer();
  createItems();
  createExitDoor();
  createFlashlight();

  window.addEventListener("resize", onResize);

  showMessage("Você precisa encontrar uma saída.", 4000);

  animate();
}

/* =====================================
   ILUMINAÇÃO
===================================== */

function createLighting() {
  const ambient = new THREE.AmbientLight(
    0x777777,
    0.25
  );

  scene.add(ambient);

  const ceilingLight = new THREE.PointLight(
    0xffd6a0,
    1.1,
    12
  );

  ceilingLight.position.set(0, 2.8, 0);
  ceilingLight.castShadow = true;
  scene.add(ceilingLight);

  const backLight = new THREE.PointLight(
    0x777777,
    0.35,
    8
  );

  backLight.position.set(0, 2, -4);
  scene.add(backLight);
}

/* =====================================
   SALA PRINCIPAL
===================================== */

function createRoom() {
  const wall = mat(0x353535);
  const floor = mat(0x292725);
  const ceiling = mat(0x242424);
  const trim = mat(0x171717);

  // Piso
  box(10, 0.25, 12, floor, 0, -0.15, -2);

  // Teto
  box(10, 0.25, 12, ceiling, 0, 3.15, -2);

  // Paredes laterais
  box(0.25, 3, 12, wall, -5, 1.5, -2);
  box(0.25, 3, 12, wall, 5, 1.5, -2);

  // Parede do fundo
  box(10, 3, 0.25, wall, 0, 1.5, -8);

  // Parede frontal dividida para a porta
  box(3.5, 3, 0.25, wall, -3.25, 1.5, 4);
  box(3.5, 3, 0.25, wall, 3.25, 1.5, 4);
  box(3, 0.65, 0.25, wall, 0, 2.675, 4);

  // Rodapés
  box(9.5, 0.12, 0.12, trim, 0, 0.05, -7.8);
  box(0.12, 0.12, 11.5, trim, -4.8, 0.05, -2);
  box(0.12, 0.12, 11.5, trim, 4.8, 0.05, -2);

  // Tapete
  const carpet = box(
    3.5, 0.035, 2.5,
    mat(0x242020),
    0, 0.01, -1.8
  );

  // Manchas e detalhes do piso
  box(0.8, 0.015, 0.06, mat(0x171515), -2, 0.015, -3);
  box(0.45, 0.015, 0.05, mat(0x171515), 2.5, 0.015, 1);

  // Detalhes na parede
  box(1.2, 0.8, 0.06, mat(0x191919), -2.8, 2, -7.82);
  box(0.8, 0.6, 0.06, mat(0x202020), 2.8, 2.1, -7.82);
}

/* =====================================
   MÓVEIS
===================================== */

function createFurniture() {
  const wood = mat(0x493326);
  const darkWood = mat(0x251b17);
  const metal = mat(0x555555);

  // Mesa principal
  box(2.8, 0.16, 1.1, wood, -2.7, 1.05, -4.5);

  // Pés da mesa
  box(0.12, 1, 0.12, darkWood, -3.9, 0.5, -4.9);
  box(0.12, 1, 0.12, darkWood, -1.5, 0.5, -4.9);
  box(0.12, 1, 0.12, darkWood, -3.9, 0.5, -4.1);
  box(0.12, 1, 0.12, darkWood, -1.5, 0.5, -4.1);

  // Gaveteiro
  box(0.65, 0.8, 0.7, darkWood, -1.5, 0.5, -4.5);

  for (let i = 0; i < 3; i++) {
    const drawer = box(
      0.58, 0.2, 0.04,
      wood,
      -1.5,
      0.75 - i * 0.23,
      -4.12
    );

    drawer.userData.closedZ = drawer.position.z;
    drawer.userData.targetZ = 0;
    drawer.userData.open = false;

    drawers.push(drawer);

    const handle = box(
      0.12, 0.035, 0.035,
      metal,
      -1.5,
      0.75 - i * 0.23,
      -4.07
    );

    drawer.userData.handle = handle;
  }

  // Armário lateral
  box(1.2, 2.2, 0.8, darkWood, 4.1, 1.1, -6.5);

  box(1.05, 2.05, 0.06, wood, 4.1, 1.1, -6.08);

  // Prateleiras
  box(1.1, 0.08, 0.7, wood, 4.1, 1.6, -6.5);
  box(1.1, 0.08, 0.7, wood, 4.1, 0.9, -6.5);

  // Cadeira
  box(0.9, 0.12, 0.8, darkWood, -2.7, 0.55, -2.8);
  box(0.9, 0.8, 0.12, darkWood, -2.7, 0.95, -3.15);

  box(0.1, 0.55, 0.1, metal, -3.05, 0.25, -2.55);
  box(0.1, 0.55, 0.1, metal, -2.35, 0.25, -2.55);
}

/* =====================================
   COMPUTADOR
===================================== */

let computerScreen;
let computerActive = false;

function createComputer() {
  const black = mat(0x080808);
  const dark = mat(0x222222);
  const screenMaterial = new THREE.MeshBasicMaterial({
    color: 0x06131a
  });

  // Monitor
  box(1.15, 0.72, 0.12, black, -2.7, 1.52, -4.5);

  computerScreen = new THREE.Mesh(
    new THREE.PlaneGeometry(1.02, 0.59),
    screenMaterial
  );

  computerScreen.position.set(-2.7, 1.52, -4.425);
  scene.add(computerScreen);

  // Base do monitor
  box(0.12, 0.25, 0.12, dark, -2.7, 1.15, -4.5);
  box(0.55, 0.05, 0.35, dark, -2.7, 1.03, -4.5);

  // Teclado
  box(0.9, 0.045, 0.32, dark, -2.7, 1.16, -3.9);

  // Gabinete
  box(0.42, 0.8, 0.7, black, -1.5, 0.55, -4.5);
}

/* =====================================
   ITENS DO JOGO
===================================== */

function createItem(name, type, x, y, z, color) {
  const geometry = new THREE.BoxGeometry(
    0.22, 0.12, 0.16
  );

  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.65
  });

  const item = new THREE.Mesh(geometry, material);

  item.position.set(x, y, z);
  item.castShadow = true;

  item.userData.name = name;
  item.userData.type = type;
  item.userData.collected = false;

  scene.add(item);
  items.push(item);

  return item;
}

function createItems() {
  // Chave sobre a mesa
  createItem(
    "Chave pequena",
    "key",
    -2.1, 1.2, -4.5,
    0xc6a34a
  );

  // Pilha
  createItem(
    "Pilha",
    "battery",
    3.5, 0.15, -5.5,
    0xaaaa22
  );

  // Documento
  const paper = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.015, 0.4),
    mat(0xbdb6a0)
  );

  paper.position.set(-3.2, 1.15, -4.5);
  paper.userData.name = "Documento";
  paper.userData.type = "document";
  paper.userData.collected = false;

  scene.add(paper);
  items.push(paper);
}

/* =====================================
   PORTA DE SAÍDA
===================================== */

function createExitDoor() {
  const doorMaterial = mat(0x39251b);
  const frameMaterial = mat(0x171717);
  const metalMaterial = mat(0x777777);

  // Batente
  box(0.15, 2.45, 0.35, frameMaterial, -1.5, 1.2, 4);
  box(0.15, 2.45, 0.35, frameMaterial, 1.5, 1.2, 4);
  box(3.1, 0.15, 0.35, frameMaterial, 0, 2.4, 4);

  // Pivô da porta
  const pivot = new THREE.Group();
  pivot.position.set(-1.35, 0, 3.82);
  scene.add(pivot);

  // Folha da porta
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(2.7, 2.3, 0.16),
    doorMaterial
  );

  door.position.set(1.35, 1.15, 0);
  door.castShadow = true;
  door.receiveShadow = true;
  pivot.add(door);

  // Detalhes da porta
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 1.65, 0.035),
    mat(0x2c1c15)
  );

  panel.position.set(1.35, 1.15, 0.1);
  pivot.add(panel);

  // Maçaneta
  const handle = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 12, 12),
    metalMaterial
  );

  handle.position.set(2.35, 1.05, 0.13);
  pivot.add(handle);

  exitDoor = pivot;
  exitDoorAngle = 0;
  exitDoorOpen = false;
}

/* =====================================
   LANTERNA
===================================== */

function createFlashlight() {
  flashlight = new THREE.SpotLight(
    0xffe5b5,
    2.5,
    13,
    Math.PI / 7,
    0.45,
    1.2
  );

  flashlight.position.set(0, 0, 0);
  flashlight.target.position.set(0, 0, -1);

  camera.add(flashlight);
  camera.add(flashlight.target);

  scene.add(camera);
}

function toggleFlashlight() {
  flashlightOn = !flashlightOn;
  flashlight.visible = flashlightOn;

  showMessage(
    flashlightOn ? "Lanterna ligada." : "Lanterna desligada."
  );
}

/* =====================================
   INVENTÁRIO E OBJETOS NAS MÃOS
===================================== */

function collectItem(item) {
  if (!item || item.userData.collected) return;

  item.userData.collected = true;

  const name = item.userData.name;
  const type = item.userData.type;

  selectedItem = {
    name,
    type,
    color: item.material.color.getHex()
  };

  itemNameElement.textContent = name;

  scene.remove(item);

  if (type === "battery") {
    battery = Math.min(100, battery + 25);
    updateBattery();
    showMessage("Você encontrou uma pilha.");
    selectedItem = null;
    itemNameElement.textContent = "Pilha utilizada";
    return;
  }

  showMessage(name + " adicionado ao inventário.");
}

function updateBattery() {
  document.getElementById("battery").textContent =
    "LANTERNA: " + Math.floor(battery) + "%";
}

function holdSelectedItem() {
  if (!selectedItem) {
    showMessage("Você não tem nenhum objeto selecionado.");
    return;
  }

  if (heldItem) {
    showMessage("Você já está segurando um objeto.");
    return;
  }

  const geometry = new THREE.BoxGeometry(0.22, 0.12, 0.16);

  const material = new THREE.MeshStandardMaterial({
    color: selectedItem.color,
    roughness: 0.7
  });

  heldItem = new THREE.Mesh(geometry, material);

  heldItem.position.set(0.38, -0.32, -0.65);
  heldItem.rotation.set(0.2, 0.2, 0);

  camera.add(heldItem);

  showMessage("Objeto em mãos: " + selectedItem.name);
}

function dropHeldItem() {
  if (!heldItem) {
    showMessage("Você não está segurando nada.");
    return;
  }

  const worldPosition = new THREE.Vector3();
  heldItem.getWorldPosition(worldPosition);

  camera.remove(heldItem);

  heldItem.position.copy(worldPosition);
  scene.add(heldItem);

  heldItem.position.y = Math.max(0.12, heldItem.position.y);

  heldItem = null;

  showMessage("Objeto colocado no chão.");
}

/* =====================================
   DETECÇÃO DE INTERAÇÃO
===================================== */

function getTarget() {
  raycaster.setFromCamera(centerNdc, camera);

  const targets = [
    ...items.filter(item => !item.userData.collected),
    ...drawers,
    exitDoor
  ];

  if (computerScreen) targets.push(computerScreen);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length === 0) return null;

  if (hits[0].distance > 3) return null;

  let object = hits[0].object;

  while (object.parent && object.parent !== scene) {
    if (
      object.userData.name ||
      object === exitDoor
    ) break;

    object = object.parent;
  }

  return object;
}

function interact() {
  if (!isPlaying) return;

  const target = getTarget();

  if (!target) {
    showMessage("Não há nada para interagir aqui.");
    return;
  }

  if (target.userData.name) {
    if (target.userData.type === "document") {
      showInspect(
        "DOCUMENTO",
        "O documento está parcialmente rasgado. Uma frase ainda pode ser lida: 'A segunda sala guarda a resposta...'"
      );
      return;
    }

    collectItem(target);
    return;
  }

  if (drawers.includes(target)) {
    toggleDrawer(target);
    return;
  }

  if (target === computerScreen) {
    activateComputer();
    return;
  }

  if (target === exitDoor) {
    toggleExitDoor();
    return;
  }

  showMessage("Você não encontrou nada útil.");
}

/* =====================================
   GAVETAS
===================================== */

function toggleDrawer(drawer) {
  drawer.userData.open = !drawer.userData.open;

  drawer.userData.targetZ =
    drawer.userData.open ? 0.32 : 0;

  showMessage(
    drawer.userData.open
      ? "Gaveta aberta."
      : "Gaveta fechada."
  );
}

function updateDrawers(dt) {
  for (let i = 0; i < drawers.length; i++) {
    const drawer = drawers[i];

    const targetZ =
      drawer.userData.closedZ +
      drawer.userData.targetZ;

    drawer.position.z = THREE.MathUtils.lerp(
      drawer.position.z,
      targetZ,
      Math.min(1, dt * 8)
    );

    if (drawer.userData.handle) {
      drawer.userData.handle.position.z =
        drawer.position.z + 0.05;
    }
  }
}

/* =====================================
   COMPUTADOR
===================================== */

function activateComputer() {
  if (computerActive) {
    showMessage("O computador já está ligado.");
    return;
  }

  computerActive = true;

  computerScreen.material.color.set(0x16aacc);

  showInspect(
    "COMPUTADOR",
    "ACESSO PARCIAL LIBERADO\n\nARQUIVO ENCONTRADO:\nSALA 02\n\nUma porta separa você da próxima área."
  );
}

/* =====================================
   PAINEL DE INSPEÇÃO
===================================== */

function showInspect(title, text) {
  document.getElementById("inspectTitle").textContent = title;
  document.getElementById("inspectText").textContent = text;

  document.getElementById("inspectPanel").style.display = "block";
}

document.getElementById("closeInspect").addEventListener("click", () => {
  document.getElementById("inspectPanel").style.display = "none";
});

/* =====================================
   PORTA DE SAÍDA
===================================== */

function toggleExitDoor() {
  if (!exitDoor) return;

  if (!exitDoorOpen) {
    if (!selectedItem || selectedItem.type !== "key") {
      showMessage("A porta está trancada. Você precisa de uma chave.");
      return;
    }

    exitDoorOpen = true;
    exitDoorTarget = -Math.PI / 2;

    showMessage("Você destrancou a porta.");
  } else {
    exitDoorOpen = false;
    exitDoorTarget = 0;

    showMessage("A porta está fechando.");
  }
}

function updateExitDoor(dt) {
  if (!exitDoor) return;

  exitDoorAngle = THREE.MathUtils.lerp(
    exitDoorAngle,
    exitDoorTarget,
    Math.min(1, dt * 3)
  );

  exitDoor.rotation.y = exitDoorAngle;

  if (
    exitDoorOpen &&
    Math.abs(exitDoorAngle - exitDoorTarget) < 0.05 &&
    !roomTwoCreated
  ) {
    createRoomTwo();
  }
}

/* =====================================
   SALA 02
===================================== */

function createRoomTwo() {
  if (roomTwoCreated) return;

  roomTwoCreated = true;

  currentRoom = 2;

  const wall = mat(0x292929);
  const floor = mat(0x202020);
  const ceiling = mat(0x151515);

  // Área da segunda sala atrás da primeira porta
  box(8, 0.2, 8, floor, 0, -0.1, 9);
  box(8, 0.2, 8, ceiling, 0, 3, 9);

  box(0.2, 3, 8, wall, -4, 1.5, 9);
  box(0.2, 3, 8, wall, 4, 1.5, 9);

  box(8, 3, 0.2, wall, 0, 1.5, 13);
  box(8, 3, 0.2, wall, 0, 1.5, 5);

  // Luz da sala
  const roomLight = new THREE.PointLight(
    0xffc98a,
    0.75,
    10
  );

  roomLight.position.set(0, 2.5, 9);
  scene.add(roomLight);

  // Mesa da segunda sala
  const wood = mat(0x38251b);

  box(2.5, 0.15, 1, wood, 0, 1, 10.5);

  box(0.12, 1, 0.12, wood, -1, 0.5, 10.1);
  box(0.12, 1, 0.12, wood, 1, 0.5, 10.1);
  box(0.12, 1, 0.12, wood, -1, 0.5, 10.9);
  box(0.12, 1, 0.12, wood, 1, 0.5, 10.9);

  // Armário
  box(1.2, 2.2, 0.7, mat(0x201713), 2.8, 1.1, 11.5);

  // Quadro na parede
  box(1.5, 1, 0.08, mat(0x101010), 0, 2, 12.85);

  // Texto visual no quadro
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#101010";
  ctx.fillRect(0, 0, 512, 256);

  ctx.fillStyle = "#b40000";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.fillText("NÃO CONFIE", 256, 105);
  ctx.fillText("EM NINGUÉM", 256, 160);

  const texture = new THREE.CanvasTexture(canvas);

  const picture = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 0.9),
    new THREE.MeshBasicMaterial({ map: texture })
  );

  picture.position.set(0, 2, 12.79);
  scene.add(picture);

  // Objetos da segunda sala
  createItem(
    "Chave da segunda sala",
    "key2",
    0, 1.15, 10.5,
    0xc6a34a
  );

  createItem(
    "Bilhete",
    "note",
    0.55, 1.15, 10.5,
    0xd6d0bd
  );

  showMessage("SALA 02 — Explore o ambiente.", 4000);
}

/* =====================================
   MOVIMENTAÇÃO
===================================== */

function updateMovement(dt) {
  if (!isPlaying || !camera) return;

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);

  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3();
  right.crossVectors(forward, camera.up).normalize();

  moveDirection.set(0, 0, 0);

  if (keys["KeyW"] || touchMovement.forward) {
    moveDirection.add(forward);
  }

  if (keys["KeyS"] || touchMovement.back) {
    moveDirection.sub(forward);
  }

  if (keys["KeyA"] || touchMovement.left) {
    moveDirection.sub(right);
  }

  if (keys["KeyD"] || touchMovement.right) {
    moveDirection.add(right);
  }

  if (moveDirection.lengthSq() > 0) {
    moveDirection.normalize();

    camera.position.addScaledVector(
      moveDirection,
      PLAYER_SPEED * dt
    );
  }

  camera.position.y = PLAYER_HEIGHT;

  // Limites básicos da sala
  if (currentRoom === 1) {
    camera.position.x = THREE.MathUtils.clamp(
      camera.position.x,
      -4.55,
      4.55
    );

    camera.position.z = THREE.MathUtils.clamp(
      camera.position.z,
      -7.4,
      3.65
    );
  } else {
    camera.position.x = THREE.MathUtils.clamp(
      camera.position.x,
      -3.5,
      3.5
    );

    camera.position.z = THREE.MathUtils.clamp(
      camera.position.z,
      5.3,
      12.4
    );
  }
}

/* =====================================
   CÂMERA E MOUSE
===================================== */

function onMouseMove(event) {
  if (!isPlaying || !isLocked) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;

  pitch = THREE.MathUtils.clamp(
    pitch,
    -Math.PI / 2.2,
    Math.PI / 2.2
  );

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

document.addEventListener("mousemove", onMouseMove);

document.addEventListener("pointerlockchange", () => {
  isLocked = document.pointerLockElement === renderer?.domElement;
});

/* =====================================
   CONTROLES DO TECLADO
===================================== */

document.addEventListener("keydown", event => {
  keys[event.code] = true;

  if (!isPlaying) return;

  if (event.code === "KeyE") interact();

  if (event.code === "KeyF") toggleFlashlight();

  if (event.code === "KeyG") holdSelectedItem();

  if (event.code === "KeyQ") dropHeldItem();

  if (event.code === "Escape") {
    showMessage("Jogo pausado.");
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

/* =====================================
   CONTROLES DE CELULAR
===================================== */

document.querySelectorAll("[data-move]").forEach(button => {
  const direction = button.dataset.move;

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    touchMovement[direction] = true;
  });

  button.addEventListener("pointerup", () => {
    touchMovement[direction] = false;
  });

  button.addEventListener("pointerleave", () => {
    touchMovement[direction] = false;
  });

  button.addEventListener("pointercancel", () => {
    touchMovement[direction] = false;
  });
});

document.getElementById("mobileInteract").addEventListener("click", interact);

document.getElementById("mobileFlash").addEventListener("click", toggleFlashlight);

document.getElementById("mobileDrop").addEventListener("click", dropHeldItem);

/* =====================================
   CÂMERA NO CELULAR
===================================== */

let touchLook = null;

document.addEventListener("touchstart", event => {
  if (!isPlaying) return;

  const touch = event.changedTouches[0];

  if (touch.clientX > window.innerWidth * 0.4) {
    touchLook = {
      x: touch.clientX,
      y: touch.clientY
    };
  }
}, { passive: true });

document.addEventListener("touchmove", event => {
  if (!isPlaying || !touchLook) return;

  const touch = event.changedTouches[0];

  const dx = touch.clientX - touchLook.x;
  const dy = touch.clientY - touchLook.y;

  yaw -= dx * 0.004;
  pitch -= dy * 0.004;

  pitch = THREE.MathUtils.clamp(
    pitch,
    -Math.PI / 2.2,
    Math.PI / 2.2
  );

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  touchLook.x = touch.clientX;
  touchLook.y = touch.clientY;
}, { passive: true });

document.addEventListener("touchend", () => {
  touchLook = null;
});

/* =====================================
   ATUALIZAÇÃO DO JOGO
===================================== */

function updateGame(dt) {
  updateMovement(dt);
  updateDrawers(dt);
  updateExitDoor(dt);

  if (flashlightOn && battery > 0) {
    battery -= dt * 0.18;

    if (battery <= 0) {
      battery = 0;
      flashlightOn = false;
      flashlight.visible = false;
      showMessage("A bateria da lanterna acabou.");
    }

    updateBattery();
  }
}

/* =====================================
   LOOP PRINCIPAL
===================================== */

function animate() {
  requestAnimationFrame(animate);

  if (!renderer || !scene || !camera) return;

  const dt = Math.min(clock.getDelta(), 0.05);

  if (isPlaying) {
    updateGame(dt);
  }

  renderer.render(scene, camera);
}

/* =====================================
   REDIMENSIONAMENTO
===================================== */

function onResize() {
  if (!camera || !renderer) return;

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}

/* =====================================
   INICIAR JOGO
===================================== */

function startGame() {
  if (isPlaying) return;

  document.getElementById("menu").style.display = "none";
  document.getElementById("hud").style.display = "block";

  if (!renderer) {
    initGame();
  }

  isPlaying = true;

  if (renderer.domElement.requestPointerLock) {
    renderer.domElement.requestPointerLock();
  }
}

/* =====================================
   MENU
===================================== */

document.getElementById("playButton").addEventListener("click", startGame);

document.getElementById("settingsButton").addEventListener("click", () => {
  alert(
    "CONFIGURAÇÕES\n\n" +
    "WASD: Movimentar\n" +
    "Mouse: Olhar\n" +
    "E: Interagir\n" +
    "F: Lanterna\n" +
    "G: Segurar objeto\n" +
    "Q: Soltar objeto"
  );
});

document.getElementById("creditsButton").addEventListener("click", () => {
  alert(
    "ENCONTRE UMA SAÍDA!\n\n" +
    "Desenvolvido por AB GAMES\n" +
    "@abgames.oficial\n\n" +
    "DESAFIE SEUS LIMITES"
  );
});

/* =====================================
   CLIQUE PARA INTERAGIR
===================================== */

document.addEventListener("mousedown", event => {
  if (!isPlaying || event.button !== 0) return;

  if (document.getElementById("inspectPanel").style.display === "block") {
    return;
  }

  const target = getTarget();

  if (target) {
    interact();
  }
});

   FIM DA PARTE 2
===================================== */

</script>
