
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENCONTRE UMA SAÍDA! | AB GAMES</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050505;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
button{
 color:white;
 background:#211010;
 border:1px solid #b52d2d;
 border-radius:8px;
 padding:16px 28px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:active{background:#a02020}

#menu{
 position:fixed;
 inset:0;
 z-index:20;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:radial-gradient(circle,#292929,#050505 75%);
 padding:20px;
}
#menu h1{
 color:#ed3030;
 font-size:clamp(30px,8vw,48px);
 text-shadow:0 0 20px #a00000;
}
#menu p{color:#aaa}
#play{width:220px;margin-top:25px}
#status{font-size:12px;color:#aaa;margin-top:20px}

#hud{
 position:fixed;
 inset:0;
 z-index:5;
 pointer-events:none;
}
#crosshair{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 font-size:24px;
}
#inventory,#battery{
 position:absolute;
 top:12px;
 background:#000a;
 border:1px solid #ffffff44;
 padding:10px;
 border-radius:5px;
 font-size:12px;
}
#inventory{left:10px}
#battery{right:10px}
#message{
 position:absolute;
 bottom:18%;
 width:100%;
 text-align:center;
 text-shadow:0 2px 5px black;
 font-size:14px;
}

#controls{
 position:fixed;
 inset:0;
 z-index:8;
 pointer-events:none;
}
#movePad{
 position:absolute;
 bottom:20px;
 left:15px;
 display:grid;
 grid-template-columns:52px 52px 52px;
 grid-template-rows:52px 52px;
 gap:5px;
 pointer-events:auto;
}
#movePad button,#actions button{
 padding:5px;
 background:#111c;
 border:1px solid #ffffff66;
 touch-action:none;
}
#forward{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#back{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{
 position:absolute;
 right:15px;
 bottom:24px;
 display:flex;
 flex-direction:column;
 gap:8px;
 pointer-events:auto;
}
#actions button{
 min-width:75px;
 min-height:45px;
 font-size:11px;
}
#lookArea{
 position:absolute;
 right:0;
 top:0;
 width:60%;
 height:70%;
 pointer-events:auto;
 touch-action:none;
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="menu">
 <div>
  <small>AB GAMES APRESENTA</small>
  <h1>ENCONTRE UMA SAÍDA!</h1>
  <p>Você acordou em um lugar onde nunca deveria estar.</p>
  <button id="play">JOGAR</button>
  <div id="status">VERSÃO 0.6</div>
 </div>
</div>

<div id="hud" class="hidden">
 <div id="crosshair">+</div>
 <div id="inventory">MÃO: VAZIA</div>
 <div id="battery">LANTERNA: DESLIGADA</div>
 <div id="message">Explore a enfermaria.</div>
</div>

<div id="controls" class="hidden">
 <div id="lookArea"></div>

 <div id="movePad">
  <button id="forward">▲</button>
  <button id="left">◀</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
 </div>

 <div id="actions">
  <button id="use">PEGAR</button>
  <button id="drop">SOLTAR</button>
  <button id="light">LUZ</button>
 </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

let THREE=null;
let scene,camera,renderer,clock;
let items=[];
let selectedItem=null;
let heldItem=null;
let flashlightOn=false;
let battery=100;
let gameStarted=false;
let animationStarted=false;
let sensitivity=.0025;
let lastTouch=null;

const keys={};
const movement={
 forward:false,
 back:false,
 left:false,
 right:false
};

/* CARREGAR THREE.JS */

async function loadThree(){
 if(window.THREE)return window.THREE;

 const sources=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"
 ];

 for(const url of sources){
  try{
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=url;
    script.onload=()=>window.THREE?resolve():reject();
    script.onerror=reject;
    document.head.appendChild(script);
   });
   if(window.THREE)return window.THREE;
  }catch(e){
   console.warn("Falha ao carregar:",url);
  }
 }

 throw new Error("Não foi possível carregar o sistema 3D. Verifique sua internet.");
}

/* BOTÃO JOGAR */

$("play").addEventListener("click",async()=>{
 if(gameStarted)return;

 $("play").disabled=true;
 $("status").textContent="CARREGANDO JOGO...";

 try{
  THREE=await loadThree();

  if(!scene)initGame();

  $("menu").classList.add("hidden");
  $("hud").classList.remove("hidden");
  $("controls").classList.remove("hidden");

  gameStarted=true;

  if(!isMobile()){
   renderer.domElement.requestPointerLock?.();
  }

  $("status").textContent="JOGO INICIADO";
 }catch(error){
  $("status").textContent=error.message;
  console.error(error);
 }finally{
  $("play").disabled=false;
 }
});

/* DETECTAR CELULAR */

function isMobile(){
 return matchMedia("(pointer:coarse)").matches;
}

/* MATERIAIS E OBJETOS */

function material(color){
 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.9
 });
}

function box(w,h,d,x,y,z,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color)
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

/* CRIAR CENÁRIO */

function initGame(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080b0e);
 scene.fog=new THREE.FogExp2(0x080b0e,.035);

 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,.1,100
 );
 camera.position.set(0,1.65,4.2);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({
  antialias:false
 });
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
 renderer.shadowMap.enabled=false;

 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(
  0x8995a4,0x161820,.55
 ));

 const ceiling=new THREE.PointLight(0x9ca8bd,1.1,13);
 ceiling.position.set(0,2.8,0);
 scene.add(ceiling);

 createRoom();
 createFurniture();
 createItems();
 createHand();
 createFlashlight();

 window.addEventListener("resize",resize);

 if(!animationStarted){
  animationStarted=true;
  animate();
 }
}

/* SALA */

function createRoom(){
 box(16,.2,12,0,0,0,0x30343a);
 box(16,.2,12,0,3.5,0,0x171a1e);

 box(16,3.5,.2,0,1.75,-6,0x45494e);
 box(16,3.5,.2,0,1.75,6,0x45494e);
 box(.2,3.5,12,-8,1.75,0,0x45494e);
 box(.2,3.5,12,8,1.75,0,0x45494e);

 box(1.8,2.8,.18,0,1.4,-5.87,0x252a30);
 box(1.5,2.55,.08,0,1.35,-5.75,0x444b52);
 box(.08,.08,.08,.55,1.3,-5.65,0xb02b2b);

 const red=new THREE.PointLight(0xc90000,1.8,7);
 red.position.set(-3,2.7,-4.8);
 scene.add(red);

 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.13,8,8),
  new THREE.MeshBasicMaterial({color:0xff1111})
 );
 bulb.position.copy(red.position);
 scene.add(bulb);
}

/* MÓVEIS */

function createFurniture(){
 // Maca
 box(2.3,.25,1.1,-3,.85,-1,0x777e84);
 box(2.2,.15,1,-3,1.05,-1,0x9ba1a4);
 box(2.25,.12,1.05,-3,1.18,-1,0x626c75);

 for(const x of [-3.9,-2.1]){
  for(const z of [-1.4,-.6]){
   box(.12,.8,.12,x,.4,z,0x45494d);
  }
 }

 box(.55,.18,.55,-3,1.29,-1,0xd1d0c8);

 // Mesa
 box(2,.15,.9,3,1.15,-1,0x6b5040);

 for(const x of [2.1,3.9]){
  for(const z of [-1.35,-.65]){
   box(.12,1.1,.12,x,.55,z,0x45413d);
  }
 }

 // Monitor
 box(.85,.55,.12,3,1.62,-.92,0x161a20);
 box(.7,.4,.025,3,1.64,-.84,0x263d45);
 box(.12,.2,.12,3,1.27,-.92,0x34383c);

 // Armários
 for(let i=0;i<3;i++){
  const x=-6+i*1.1;
  box(.9,2.4,.75,x,1.2,-2.2,0x555d64);
  box(.04,.1,.04,x+.25,1.2,-1.79,0xc2c2c2);
 }

 // Cadeira
 box(.7,.12,.7,4,.65,1,0x292e34);
 box(.12,.7,.12,4,.3,1,0x34383c);
 box(.7,.1,.12,4,1,1.25,0x34383c);
}

/* OBJETOS PEGÁVEIS */

function makeItem(type,x,y,z){
 const group=new THREE.Group();

 group.userData.type=type;
 group.userData.name=
  type==="flashlight"?"Lanterna":"Cartão de acesso";
 group.userData.pickable=true;
 group.userData.restHeight=
  type==="flashlight"?.075:.013;

 if(type==="flashlight"){
  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.075,.48,10),
   material(0x22272d)
  );
  body.rotation.x=Math.PI/2;
  group.add(body);

  const lens=new THREE.Mesh(
   new THREE.CylinderGeometry(.078,.078,.025,10),
   new THREE.MeshBasicMaterial({color:0xd7e6ec})
  );
  lens.rotation.x=Math.PI/2;
  lens.position.z=-.245;
  group.add(lens);
 }else{
  const card=new THREE.Mesh(
   new THREE.BoxGeometry(.24,.025,.16),
   material(0xb5c8d0)
  );
  group.add(card);

  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(.15,.006,.025),
   material(0x273c4a)
  );
  stripe.position.y=.016;
  group.add(stripe);
 }

 group.position.set(x,y,z);
 scene.add(group);
 items.push(group);
 return group;
}

function createItems(){
 makeItem("flashlight",2.5,1.30,-1);
 makeItem("card",3.65,1.238,-1.25);
}

/* MÃO */

function createHand(){
 const hand=new THREE.Group();

 const palm=new THREE.Mesh(
  new THREE.BoxGeometry(.17,.12,.2),
  material(0xb58b70)
 );
 hand.add(palm);

 for(let i=0;i<4;i++){
  const finger=new THREE.Mesh(
   new THREE.BoxGeometry(.035,.12,.045),
   material(0xb58b70)
  );
  finger.position.set(-.065+i*.043,-.09,-.035);
  hand.add(finger);
 }

 hand.position.set(.4,-.38,-.72);
 camera.add(hand);
 scene.add(camera);
}

/* LANTERNA */

function createFlashlight(){
 const light=new THREE.SpotLight(
  0xffffff,0,18,Math.PI/8,.45,1
 );

 light.position.set(0,0,0);
 light.target.position.set(0,0,-1);

 camera.add(light);
 camera.add(light.target);
 camera.userData.flashlight=light;
}

/* IDENTIFICAR OBJETO */

function updateRaycast(){
 if(heldItem){
  selectedItem=null;
  $("message").textContent="Q / SOLTAR OBJETO";
  return;
 }

 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);

 const hits=ray.intersectObjects(
  items.filter(i=>i.visible),true
 );

 selectedItem=null;

 if(hits.length){
  let obj=hits[0].object;

  while(obj.parent&&!obj.userData.pickable){
   obj=obj.parent;
  }

  if(obj.userData.pickable){
   selectedItem=obj;
   $("message").textContent=
    "E / PEGAR: "+obj.userData.name;
   return;
  }
 }

 $("message").textContent="Explore a enfermaria.";
}

/* PEGAR */

function pickItem(){
 if(heldItem){
  $("message").textContent="Você já está segurando um objeto.";
  return;
 }

 if(!selectedItem){
  $("message").textContent="Olhe para um objeto primeiro.";
  return;
 }

 heldItem=selectedItem;
 scene.remove(heldItem);

 heldItem.position.set(.35,-.28,-.65);
 heldItem.rotation.set(0,0,0);
 camera.add(heldItem);

 $("inventory").textContent=
  "MÃO: "+heldItem.userData.name.toUpperCase();

 selectedItem=null;
}

/* SOLTAR */

function dropItem(){
 if(!heldItem){
  $("message").textContent="Sua mão está vazia.";
  return;
 }

 const item=heldItem;
 camera.remove(item);

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);

 const position=camera.position.clone()
  .add(direction.multiplyScalar(1.15));

 position.x=THREE.MathUtils.clamp(position.x,-7,7);
 position.z=THREE.MathUtils.clamp(position.z,-5.5,5.5);

 const onTable=
  position.x>2.05&&position.x<3.95&&
  position.z<-.55&&position.z>-1.45;

 position.y=onTable?
  1.225+item.userData.restHeight:
  .1+item.userData.restHeight;

 item.position.copy(position);
 item.rotation.set(0,Math.random()*.5,0);
 scene.add(item);

 heldItem=null;

 $("inventory").textContent="MÃO: VAZIA";
 $("message").textContent="Objeto solto.";
}

/* LIGAR LANTERNA */

function toggleLight(){
 if(battery<=0){
  $("message").textContent="A bateria acabou.";
  return;
 }

 flashlightOn=!flashlightOn;

 camera.userData.flashlight.intensity=
  flashlightOn?3.2:0;

 $("battery").textContent=
  "LANTERNA: "+(flashlightOn?"LIGADA":"DESLIGADA");
}

/* MOVIMENTO */

function updateMovement(dt){
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3()
  .crossVectors(forward,new THREE.Vector3(0,1,0))
  .normalize()
  .negate();

 const move=new THREE.Vector3();

 if(keys.KeyW||movement.forward)move.add(forward);
 if(keys.KeyS||movement.back)move.sub(forward);
 if(keys.KeyA||movement.left)move.sub(right);
 if(keys.KeyD||movement.right)move.add(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(3*dt);
  camera.position.add(move);
 }

 camera.position.x=THREE.MathUtils.clamp(
  camera.position.x,-7.3,7.3
 );
 camera.position.z=THREE.MathUtils.clamp(
  camera.position.z,-5.3,5.3
 );
 camera.position.y=1.65;
}

/* LOOP */

function animate(){
 requestAnimationFrame(animate);

 if(!renderer||!scene)return;

 const dt=Math.min(clock.getDelta(),.05);

 if(gameStarted){
  updateMovement(dt);
  updateRaycast();

  if(flashlightOn){
   battery=Math.max(0,battery-dt*.08);

   if(battery<=0){
    flashlightOn=false;
    camera.userData.flashlight.intensity=0;
    $("battery").textContent="LANTERNA: SEM BATERIA";
   }
  }
 }

 renderer.render(scene,camera);
}

/* REDIMENSIONAR */

function resize(){
 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* TECLADO */

document.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(!gameStarted)return;

 if(e.code==="KeyE")pickItem();
 if(e.code==="KeyQ")dropItem();
 if(e.code==="KeyF")toggleLight();
});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});

/* MOUSE */

document.addEventListener("mousemove",e=>{
 if(!renderer||document.pointerLockElement!==renderer.domElement)return;
 if(!gameStarted)return;

 camera.rotation.y-=e.movementX*sensitivity;
 camera.rotation.x-=e.movementY*sensitivity;

 camera.rotation.x=THREE.MathUtils.clamp(
  camera.rotation.x,-1.4,1.4
 );
});

/* CONTROLES CELULAR */

function bindMove(id,direction){
 const button=$(id);

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  movement[direction]=true;
 });

 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  button.addEventListener(event,()=>{
   movement[direction]=false;
  });
 });
}

bindMove("forward","forward");
bindMove("back","back");
bindMove("left","left");
bindMove("right","right");

$("lookArea").addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
});

$("lookArea").addEventListener("pointermove",e=>{
 if(!lastTouch||!gameStarted)return;

 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;

 camera.rotation.y-=dx*.004;
 camera.rotation.x-=dy*.004;

 camera.rotation.x=THREE.MathUtils.clamp(
  camera.rotation.x,-1.4,1.4
 );

 lastTouch={x:e.clientX,y:e.clientY};
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
 $("lookArea").addEventListener(event,()=>{
  lastTouch=null;
 });
});

/* BOTÕES DE AÇÃO */

$("use").onclick=()=>{
 if(heldItem)dropItem();
 else pickItem();
};

$("drop").onclick=dropItem;
$("light").onclick=toggleLight;

</script>
</body>
</html>
