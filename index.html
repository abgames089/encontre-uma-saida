
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENCONTRE UMA SAÍDA! | AB GAMES</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#050607;
 color:white;
 font-family:Arial,sans-serif;
}
button{
 border:1px solid #922323;
 background:#170d0d;
 color:white;
 padding:12px 18px;
 border-radius:7px;
 font-weight:bold;
 cursor:pointer;
}
button:active{background:#7b1717}
#menu,#pause,#credits{
 position:fixed;
 inset:0;
 z-index:10;
 background:radial-gradient(ellipse at center,#222 0%,#080808 75%);
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}
.panel{width:min(90%,420px)}
h1{
 color:#e22b2b;
 font-size:clamp(30px,7vw,48px);
 text-shadow:0 0 18px #9b1717;
}
.subtitle{color:#aaa;letter-spacing:4px}
.buttons{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin-top:30px;
}
.hidden{display:none!important}
#hud{
 position:fixed;
 inset:0;
 z-index:3;
 pointer-events:none;
}
#crosshair{
 position:absolute;
 left:50%;top:50%;
 transform:translate(-50%,-50%);
 font-size:22px;
 color:white;
}
#message{
 position:absolute;
 bottom:17%;
 width:100%;
 text-align:center;
 color:white;
 text-shadow:0 2px 5px black;
 font-size:14px;
}
#inventory{
 position:absolute;
 top:15px;left:15px;
 padding:10px;
 background:#0009;
 border:1px solid #ffffff33;
 border-radius:6px;
 font-size:13px;
}
#battery{
 position:absolute;
 top:15px;right:15px;
 background:#0009;
 padding:10px;
 border-radius:6px;
}
#controls{
 position:fixed;
 inset:0;
 z-index:5;
 pointer-events:none;
}
#movePad{
 position:absolute;
 bottom:25px;
 left:20px;
 display:grid;
 grid-template-columns:55px 55px 55px;
 grid-template-rows:55px 55px;
 gap:4px;
 pointer-events:auto;
}
#movePad button,#actions button{
 background:#111b;
 border:1px solid #ffffff66;
 padding:5px;
 font-size:18px;
 touch-action:none;
}
#forward{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#back{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{
 position:absolute;
 right:18px;
 bottom:30px;
 display:flex;
 flex-direction:column;
 gap:9px;
 pointer-events:auto;
}
#actions button{
 min-width:76px;
 min-height:48px;
 font-size:12px;
}
#lookArea{
 position:absolute;
 right:0;top:0;
 width:60%;height:70%;
 pointer-events:auto;
 touch-action:none;
}
#settings{
 position:fixed;
 z-index:12;
 inset:0;
 background:#080808ee;
 display:none;
 align-items:center;
 justify-content:center;
}
.setting-row{
 margin:15px 0;
 display:flex;
 justify-content:space-between;
 gap:15px;
}
select,input{max-width:130px}
</style>
</head>

<body>

<div id="menu">
 <div class="panel">
  <div class="subtitle">AB GAMES APRESENTA</div>
  <h1>ENCONTRE UMA SAÍDA!</h1>
  <p>Você acordou em um lugar onde nunca deveria estar.</p>
  <div class="buttons">
   <button id="play">JOGAR</button>
   <button id="continue">CONTINUAR</button>
   <button id="openSettings">CONFIGURAÇÕES</button>
   <button id="openCredits">CRÉDITOS</button>
  </div>
  <p style="color:#666;font-size:11px;margin-top:25px">AB GAMES • VERSÃO 0.3</p>
 </div>
</div>

<div id="pause" class="hidden">
 <div class="panel">
  <h1>PAUSADO</h1>
  <div class="buttons">
   <button id="resume">CONTINUAR</button>
   <button id="pauseSettings">CONFIGURAÇÕES</button>
   <button id="backMenu">MENU PRINCIPAL</button>
  </div>
 </div>
</div>

<div id="credits" class="hidden">
 <div class="panel">
  <h1>CRÉDITOS</h1>
  <p>Desenvolvimento: AB GAMES</p>
  <p>ENCONTRE UMA SAÍDA!</p>
  <button id="closeCredits">VOLTAR</button>
 </div>
</div>

<div id="settings">
 <div class="panel">
  <h1>CONFIGURAÇÕES</h1>
  <div class="setting-row">
   <label>Qualidade gráfica</label>
   <select id="quality">
    <option value="low">BAIXO</option>
    <option value="medium" selected>MÉDIO</option>
    <option value="high">ALTO</option>
   </select>
  </div>
  <div class="setting-row">
   <label>Volume</label>
   <input id="volume" type="range" min="0" max="100" value="45">
  </div>
  <div class="setting-row">
   <label>Sensibilidade</label>
   <input id="sensitivity" type="range" min="1" max="10" value="5">
  </div>
  <div class="setting-row">
   <label>Reduzir efeitos</label>
   <input id="effects" type="checkbox">
  </div>
  <div class="buttons">
   <button id="saveSettings">SALVAR E VOLTAR</button>
  </div>
 </div>
</div>

<div id="hud" class="hidden">
 <div id="crosshair">+</div>
 <div id="inventory">MÃO: VAZIA</div>
 <div id="battery">LANTERNA: DESLIGADA</div>
 <div id="message">Explore a enfermaria.</div>
</div>

<div id="controls" class="hidden">
 <div id="lookArea"></div>
 <div id="movePad">
  <button id="forward">▲</button>
  <button id="left">◀</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
 </div>
 <div id="actions">
  <button id="use">PEGAR</button>
  <button id="drop">SOLTAR</button>
  <button id="light">LUZ</button>
  <button id="pauseButton">PAUSAR</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

let scene,camera,renderer,clock;
let running=false,paused=false;
let flashlightOn=false;
let heldItem=null;
let selectedItem=null;
let items=[];
let velocity=new THREE.Vector3();
let yaw=0,pitch=0;
let sensitivity=0.0025;
let keys={};
let mobileMove={forward:false,back:false,left:false,right:false};
let lastTouch=null;
let battery=100;
let quality="medium";
let raycaster=new THREE.Raycaster();

const menu=$("menu");
const pauseScreen=$("pause");
const credits=$("credits");
const settings=$("settings");
const hud=$("hud");
const controls=$("controls");
const message=$("message");

function showMessage(text){
 message.textContent=text;
}

function startGame(){
 menu.classList.add("hidden");
 pauseScreen.classList.add("hidden");
 credits.classList.add("hidden");
 settings.style.display="none";
 hud.classList.remove("hidden");
 controls.classList.remove("hidden");

 if(!scene) init3D();

 running=true;
 paused=false;
 clock.start();

 if(renderer && renderer.domElement.requestPointerLock && !isMobile()){
  renderer.domElement.requestPointerLock();
 }
}

function isMobile(){
 return matchMedia("(pointer: coarse)").matches;
}

function pauseGame(){
 if(!running)return;
 paused=true;
 pauseScreen.classList.remove("hidden");
 document.exitPointerLock?.();
}

function resumeGame(){
 paused=false;
 pauseScreen.classList.add("hidden");
 if(!isMobile()) renderer.domElement.requestPointerLock?.();
}

function backToMenu(){
 running=false;
 paused=false;
 pauseScreen.classList.add("hidden");
 hud.classList.add("hidden");
 controls.classList.add("hidden");
 menu.classList.remove("hidden");
 document.exitPointerLock?.();
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080b0e);
 scene.fog=new THREE.FogExp2(0x080b0e,0.035);

 camera=new THREE.PerspectiveCamera(
  75,window.innerWidth/window.innerHeight,0.1,100
 );
 camera.position.set(0,1.65,4.2);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({antialias:false});
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=false;
 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 const ambient=new THREE.HemisphereLight(0x8995a4,0x161820,0.55);
 scene.add(ambient);

 const ceilingLight=new THREE.PointLight(0x9ca8bd,1.1,13);
 ceilingLight.position.set(0,2.8,0);
 scene.add(ceilingLight);

 createRoom();
 createFurniture();
 createItems();
 createHand();
 createFlashlight();

 window.addEventListener("resize",resize);
 animate();
}

function material(color,roughness=0.9){
 return new THREE.MeshStandardMaterial({
  color,roughness
 });
}

function box(w,h,d,x,y,z,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color)
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

function createRoom(){
 // Chão
 box(16,.2,12,0,0,0,0x30343a);

 // Teto
 box(16,.2,12,0,3.5,0,0x171a1e);

 // Paredes
 box(16,3.5,.2,0,1.75,-6,0x45494e);
 box(16,3.5,.2,0,1.75,6,0x45494e);
 box(.2,3.5,12,-8,1.75,0,0x45494e);
 box(.2,3.5,12,8,1.75,0,0x45494e);

 // Porta
 box(1.8,2.8,.18,0,1.4,-5.87,0x252a30);
 box(1.5,2.55,.08,0,1.35,-5.75,0x444b52);
 box(.08,.08,.08,.55,1.3,-5.65,0xb02b2b);

 // Luz vermelha de emergência
 const red=new THREE.PointLight(0xc90000,1.8,7);
 red.position.set(-3,2.7,-4.8);
 scene.add(red);

 const redBulb=new THREE.Mesh(
  new THREE.SphereGeometry(.13,8,8),
  new THREE.MeshBasicMaterial({color:0xff1111})
 );
 redBulb.position.copy(red.position);
 scene.add(redBulb);
}

function createFurniture(){
 // Maca
 box(2.3,.25,1.1,-3,.85,-1,0x777e84);
 box(2.2,.15,1,-3,1.05,-1,0x9ba1a4);
 box(2.25,.12,1.05,-3,1.18,-1,0x626c75);

 for(let x of [-3.9,-2.1]){
  for(let z of [-1.4,-.6]){
   box(.12,.8,.12,x,.4,z,0x45494d);
  }
 }

 // Travesseiro
 box(.55,.18,.55,-3,1.29,-1,0xd1d0c8);

 // Mesa
 box(2,.15,.9,3,1.15,-1,0x6b5040);
 for(let x of [2.1,3.9]){
  for(let z of [-1.35,-.65]){
   box(.12,1.1,.12,x,.55,z,0x45413d);
  }
 }

 // Monitor
 box(.85,.55,.12,3,1.62,-.92,0x161a20);
 box(.7,.4,.025,3,1.64,-.84,0x263d45);
 box(.12,.2,.12,3,1.27,-.92,0x34383c);

 // Armários
 for(let i=0;i<3;i++){
  const x=-6+i*1.1;
  box(.9,2.4,.75,x,1.2,-2.2,0x555d64);
  box(.04,.1,.04,x+.25,1.2,-1.79,0xc2c2c2);
 }

 // Cadeira
 box(.7,.12,.7,4,0.65,1,0x292e34);
 box(.12,.7,.12,4,.3,1,0x34383c);
 box(.7,.1,.12,4,1,1.25,0x34383c);
}

function makeItem(type,x,y,z){
 const group=new THREE.Group();
 group.userData.type=type;
 group.userData.name=type==="flashlight"?"Lanterna":"Cartão de acesso";

 if(type==="flashlight"){
  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.075,.48,10),
   material(0x22272d)
  );
  body.rotation.x=Math.PI/2;
  group.add(body);

  const lens=new THREE.Mesh(
   new THREE.CylinderGeometry(.078,.078,.025,10),
   new THREE.MeshBasicMaterial({color:0xd7e6ec})
  );
  lens.rotation.x=Math.PI/2;
  lens.position.z=-.245;
  group.add(lens);

  group.userData.restHeight=.075;
 }else{
  const card=new THREE.Mesh(
   new THREE.BoxGeometry(.24,.025,.16),
   material(0xb5c8d0)
  );
  group.add(card);

  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(.15,.006,.025),
   material(0x273c4a)
  );
  stripe.position.y=.016;
  group.add(stripe);

  group.userData.restHeight=.013;
 }

 group.position.set(x,y,z);
 group.userData.pickable=true;
 scene.add(group);
 items.push(group);
 return group;
}

function createItems(){
 // Lanterna apoiada sobre a mesa
 makeItem("flashlight",2.5,1.30,-1);

 // Cartão apoiado sobre a mesa
 makeItem("card",3.65,1.24,-1.25);
}

function createHand(){
 const hand=new THREE.Group();

 const palm=new THREE.Mesh(
  new THREE.BoxGeometry(.17,.12,.2),
  material(0xb58b70)
 );
 hand.add(palm);

 for(let i=0;i<4;i++){
  const finger=new THREE.Mesh(
   new THREE.BoxGeometry(.035,.12,.045),
   material(0xb58b70)
  );
  finger.position.set(-.065+i*.043,-.09,-.035);
  hand.add(finger);
 }

 hand.position.set(.4,-.38,-.72);
 camera.add(hand);
 scene.add(camera);
 hand.visible=true;
 camera.userData.hand=hand;
}

function createFlashlight(){
 const light=new THREE.SpotLight(0xffffff,0,18,Math.PI/8,.45,1);
 light.position.set(0,0,0);
 light.target.position.set(0,0,-1);
 camera.add(light);
 camera.add(light.target);
 camera.userData.flashlight=light;
}

function updateRaycast(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const targets=items.filter(item=>item.visible);
 const hits=raycaster.intersectObjects(targets,true);

 selectedItem=null;

 if(hits.length){
  let obj=hits[0].object;
  while(obj.parent && !obj.userData.pickable){
   obj=obj.parent;
  }

  if(obj.userData.pickable){
   selectedItem=obj;
   showMessage("E / PEGAR: "+obj.userData.name);
   return;
  }
 }

 showMessage("Explore a enfermaria.");
}

function pickItem(){
 if(heldItem){
  showMessage("Você já está segurando um objeto.");
  return;
 }

 if(!selectedItem){
  showMessage("Olhe para um objeto para pegá-lo.");
  return;
 }

 heldItem=selectedItem;
 scene.remove(heldItem);

 heldItem.position.set(0,0,-.32);
 heldItem.rotation.set(0,0,0);
 camera.add(heldItem);

 $("inventory").textContent="MÃO: "+heldItem.userData.name.toUpperCase();
 showMessage("Objeto pego!");
 selectedItem=null;
}

function dropItem(){
 if(!heldItem){
  showMessage("Sua mão está vazia.");
  return;
 }

 const item=heldItem;
 camera.remove(item);

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);

 const position=camera.position.clone().add(direction.multiplyScalar(1.15));

 // Limites do cenário
 position.x=Math.max(-7,Math.min(7,position.x));
 position.z=Math.max(-5.5,Math.min(5.5,position.z));

 // Mesa: área aproximada de x 2 a 4 e z -1.45 a -.55
 const onTable=
  position.x>2 && position.x<4 &&
  position.z>-1.45 && position.z<-.55;

 if(onTable){
  position.y=1.225+item.userData.restHeight;
 }else{
  position.y=.1+item.userData.restHeight;
 }

 item.position.copy(position);
 item.rotation.set(0,Math.random()*.5,0);
 scene.add(item);

 heldItem=null;
 $("inventory").textContent="MÃO: VAZIA";
 showMessage("Objeto solto.");
}

function toggleFlashlight(){
 flashlightOn=!flashlightOn;

 const light=camera.userData.flashlight;
 light.intensity=flashlightOn?3.2:0;

 $("battery").textContent="LANTERNA: "+
  (flashlightOn?"LIGADA":"DESLIGADA");
}

function updateMovement(dt){
 const speed=3.0;
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3()
  .crossVectors(forward,new THREE.Vector3(0,1,0))
  .normalize()
  .negate();

 let move=new THREE.Vector3();

 if(keys.KeyW||mobileMove.forward)move.add(forward);
 if(keys.KeyS||mobileMove.back)move.sub(forward);
 if(keys.KeyA||mobileMove.left)move.sub(right);
 if(keys.KeyD||mobileMove.right)move.add(right);

 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(speed*dt);
  camera.position.add(move);
 }

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7.3,7.3);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-5.3,5.3);
 camera.position.y=1.65;
}

function animate(){
 requestAnimationFrame(animate);

 if(!renderer||!scene)return;

 const dt=Math.min(clock.getDelta(),.05);

 if(running&&!paused){
  updateMovement(dt);
  updateRaycast();

  if(flashlightOn){
   battery=Math.max(0,battery-dt*.08);
   if(battery<=0){
    flashlightOn=false;
    camera.userData.flashlight.intensity=0;
    $("battery").textContent="LANTERNA: SEM BATERIA";
   }
  }
 }

 renderer.render(scene,camera);
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
}

function applyQuality(){
 if(!renderer)return;

 quality=$("quality").value;

 if(quality==="low"){
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled=false;
 }else if(quality==="medium"){
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
  renderer.shadowMap.enabled=false;
 }else{
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=false;
 }
}

// MENU
$("play").onclick=startGame;
$("continue").onclick=startGame;
$("resume").onclick=resumeGame;
$("pauseButton").onclick=pauseGame;
$("backMenu").onclick=backToMenu;

$("openCredits").onclick=()=>{
 credits.classList.remove("hidden");
 menu.classList.add("hidden");
};

$("closeCredits").onclick=()=>{
 credits.classList.add("hidden");
 menu.classList.remove("hidden");
};

$("openSettings").onclick=()=>{
 settings.style.display="flex";
};

$("pauseSettings").onclick=()=>{
 pauseScreen.classList.add("hidden");
 settings.style.display="flex";
};

$("saveSettings").onclick=()=>{
 sensitivity=Number($("sensitivity").value)*.0005;
 applyQuality();
 settings.style.display="none";

 if(running){
  paused=true;
  pauseScreen.classList.remove("hidden");
 }
};

// INTERAÇÕES
$("use").onclick=()=>{
 if(heldItem)dropItem();
 else pickItem();
};

$("drop").onclick=dropItem;
$("light").onclick=toggleFlashlight;

// TECLADO
document.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="KeyE")pickItem();
 if(e.code==="KeyQ")dropItem();
 if(e.code==="KeyF")toggleFlashlight();
 if(e.code==="Escape"&&running&&!paused)pauseGame();
});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});

// MOUSE
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer?.domElement)return;
 if(paused||!running)return;

 yaw-=e.movementX*sensitivity;
 pitch-=e.movementY*sensitivity;
 pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);

 camera.rotation.set(pitch,yaw,0);
});

rendererSetup();

function rendererSetup(){
 // Os eventos de mouse são ativados depois da criação do cenário.
}

// CELULAR: movimentação
function bindMove(id,direction){
 const button=$(id);

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  mobileMove[direction]=true;
 });

 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  button.addEventListener(event,()=>{
   mobileMove[direction]=false;
  });
 });
}

bindMove("forward","forward");
bindMove("back","back");
bindMove("left","left");
bindMove("right","right");

// CELULAR: olhar ao redor
$("lookArea").addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
});

$("lookArea").addEventListener("pointermove",e=>{
 if(!lastTouch||!running||paused)return;

 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;

 yaw-=dx*.004;
 pitch-=dy*.004;
 pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);

 camera.rotation.set(pitch,yaw,0);

 lastTouch={x:e.clientX,y:e.clientY};
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
 $("lookArea").addEventListener(event,()=>lastTouch=null);
});

})();
</script>
</body>
</html>
