
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB GAMES — TESTE DE COLISÃO V4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0c;color:white;font-family:Arial;overflow:hidden}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:#101411}
button{padding:15px 40px;background:#681919;color:white;border:1px solid #ed3030;border-radius:7px;font-weight:bold}
#info{position:fixed;top:12px;left:12px;background:#000a;padding:10px;z-index:2;font-size:13px}
#controls{position:fixed;bottom:20px;left:15px;display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px;gap:5px;z-index:3}
#controls button{padding:5px}
#forward{grid-column:2}#left{grid-column:1;grid-row:2}
#back{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<div id="menu">
 <div>
  <h1>AB GAMES</h1>
  <h2>TESTE DE COLISÃO V4.0</h2>
  <button id="play">JOGAR</button>
 </div>
</div>
<div id="info">WASD: movimentar | Mouse: olhar</div>
<div id="controls">
 <button id="forward">▲</button>
 <button id="left">◀</button>
 <button id="back">▼</button>
 <button id="right">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script>
let scene,camera,renderer,clock;
let collisionBoxes=[];
const keys={};
const movement={forward:false,back:false,left:false,right:false};
const PLAYER_RADIUS=.32;

function addBox(w,h,d,x,y,z,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.9})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

function addCollision(x,z,w,d){
 collisionBoxes.push({
  minX:x-w/2,maxX:x+w/2,
  minZ:z-d/2,maxZ:z+d/2
 });
}

function obstacle(w,h,d,x,y,z,color){
 addBox(w,h,d,x,y,z,color);
 addCollision(x,z,w,d);
}

function createRoom(){
 // Piso e teto
 addBox(16,.2,12,0,0,0,0x626860);
 addBox(16,.2,12,0,3.5,0,0x454b47);

 // Paredes laterais e frontal
 addBox(.2,3.5,12,-8,1.75,0,0x777b73);
 addBox(.2,3.5,12,8,1.75,0,0x777b73);
 addBox(16,3.5,.2,0,1.75,6,0x777b73);

 // Parede traseira dividida: abertura central livre
 addBox(6.8,3.5,.2,-4.6,1.75,-6,0x777b73);
 addBox(6.8,3.5,.2,4.6,1.75,-6,0x777b73);
 addBox(2.4,.65,.2,0,3.175,-6,0x777b73);

 // Moldura da abertura
 addBox(.12,2.85,.18,-1.2,1.425,-5.83,0x444a47);
 addBox(.12,2.85,.18,1.2,1.425,-5.83,0x444a47);
 addBox(2.5,.12,.18,0,2.85,-5.83,0x444a47);
}

function createBed(x,z){
 const g=new THREE.Group();
 const m=new THREE.MeshStandardMaterial({color:0x555d60});
 const mattress=new THREE.Mesh(
  new THREE.BoxGeometry(2.12,.18,.96),
  new THREE.MeshStandardMaterial({color:0x858984})
 );
 mattress.position.y=.75;
 g.add(mattress);

 const frame=new THREE.Mesh(new THREE.BoxGeometry(2.25,.16,1.05),m);
 frame.position.y=.58;
 g.add(frame);

 for(const a of [-.95,.95]){
  for(const b of [-.4,.4]){
   const leg=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.48,8),m);
   leg.position.set(a,.32,b);
   g.add(leg);
  }
 }
 g.position.set(x,0,z);
 scene.add(g);
 addCollision(x,z,2.45,1.25);
}

function createCabinet(x,z){
 const g=new THREE.Group();
 const m=new THREE.MeshStandardMaterial({color:0x777c79});
 const body=new THREE.Mesh(new THREE.BoxGeometry(.95,1.85,.65),m);
 body.position.y=1.02;
 g.add(body);
 const door=new THREE.Mesh(new THREE.BoxGeometry(.9,1.78,.045),m);
 door.position.set(0,1.02,.35);
 g.add(door);
 g.position.set(x,0,z);
 scene.add(g);
 addCollision(x,z,1.15,.85);
}

function createChair(x,z,rotation=0){
 const g=new THREE.Group();
 const wood=new THREE.MeshStandardMaterial({color:0x34383a});
 const metal=new THREE.MeshStandardMaterial({color:0x24282a});

 function part(w,h,d,px,py,pz,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(px,py,pz);
  g.add(m);
 }

 part(.52,.1,.52,0,.84,0,wood);
 part(.52,.68,.09,0,1.18,-.215,wood);

 for(const [x,z] of [[-.2,.2],[.2,.2],[-.2,-.2],[.2,-.2]]){
  part(.055,.74,.055,x,.47,z,metal);
 }

 g.position.set(x,0,z);
 g.rotation.y=rotation;
 scene.add(g);
 addCollision(x,z,.65,.65);
}

function createTable(x,z,w=1.25,d=.72){
 const g=new THREE.Group();
 const m=new THREE.MeshStandardMaterial({color:0x555c5d});

 const top=new THREE.Mesh(new THREE.BoxGeometry(w,.1,d),m);
 top.position.y=.82;
 g.add(top);

 for(const a of [-w*.42,w*.42]){
  for(const b of [-d*.38,d*.38]){
   const leg=new THREE.Mesh(new THREE.BoxGeometry(.07,.78,.07),m);
   leg.position.set(a,.41,b);
   g.add(leg);
  }
 }
 g.position.set(x,0,z);
 scene.add(g);
 addCollision(x,z,w+.2,d+.2);
}

function createFurniture(){
 createBed(-3,-1);
 createBed(1.2,-3.8);

 createCabinet(-6,-2.7);
 createCabinet(5,-2.5);

 createTable(3,-1,2.05,.82);
 createTable(-1.1,3.8);
 createTable(-6,.2);

 createChair(1.65,-.1,Math.PI);
 createChair(3.1,.45);
 createChair(-1.8,3.1,Math.PI);
}

// COLISÃO
function createCollisionSystem(){
 collisionBoxes=[];

 // Paredes laterais e frontal
 addCollision(-7.85,0,.3,12);
 addCollision(7.85,0,.3,12);
 addCollision(0,5.85,16,.3);

 // Parede traseira: sem bloquear a abertura central
 addCollision(-4.6,-5.85,6.8,.3);
 addCollision(4.6,-5.85,6.8,.3);

 // Os móveis registram suas próprias colisões
}

function collidesAt(x,z){
 for(const o of collisionBoxes){
  const cx=THREE.MathUtils.clamp(x,o.minX,o.maxX);
  const cz=THREE.MathUtils.clamp(z,o.minZ,o.maxZ);
  const dx=x-cx,dz=z-cz;
  if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return true;
 }
 return false;
}

function moveWithCollision(dx,dz){
 const nx=camera.position.x+dx;
 if(nx>-7.35&&nx<7.35&&!collidesAt(nx,camera.position.z)){
  camera.position.x=nx;
 }

 const nz=camera.position.z+dz;
 if(nz>-5.35&&nz<5.35&&!collidesAt(camera.position.x,nz)){
  camera.position.z=nz;
 }
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x171b19);
 scene.fog=new THREE.FogExp2(0x171b19,.018);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,80);
 camera.position.set(0,1.65,4.2);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({antialias:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1));
 renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.AmbientLight(0xffffff,.45));
 const light=new THREE.PointLight(0xe5e9e3,1.1,18);
 light.position.set(0,3,0);
 scene.add(light);

 createRoom();
 createFurniture();
 createCollisionSystem();

 clock=new THREE.Clock();
 animate();
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 const forward=
  Number(keys.KeyW||movement.forward)-
  Number(keys.KeyS||movement.back);

 const side=
  Number(keys.KeyD||movement.right)-
  Number(keys.KeyA||movement.left);

 const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
 f.y=0;f.normalize();

 const r=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
 r.y=0;r.normalize();

 const v=f.multiplyScalar(forward).add(r.multiplyScalar(side));

 if(v.lengthSq()>0){
  v.normalize().multiplyScalar(3.1*dt);
  moveWithCollision(v.x,v.z);
 }

 renderer.render(scene,camera);
}

$("play").onclick=()=>{
 $("menu").style.display="none";
 init();
 renderer.domElement.requestPointerLock?.();
};

function $(id){return document.getElementById(id)}

window.addEventListener("keydown",e=>keys[e.code]=true);
window.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer?.domElement||!camera)return;
 camera.rotation.y-=e.movementX*.002;
 camera.rotation.x-=e.movementY*.002;
 camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x,-1.5,1.5);
});

const directions=["forward","back","left","right"];
directions.forEach(d=>{
 const b=$(d);
 const on=e=>{e.preventDefault();movement[d]=true};
 const off=e=>{e.preventDefault();movement[d]=false};
 b.addEventListener("pointerdown",on);
 ["pointerup","pointercancel","pointerleave"].forEach(t=>b.addEventListener(t,off));
});

window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
